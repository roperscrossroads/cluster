---
# Replica bounds and idle time. The metric comes from the add-on's scaler,
# which pushes the InterceptorRoute's concurrency to KEDA.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${STANDBY_APP}
spec:
  scaleTargetRef:
    name: ${STANDBY_APP}
  minReplicaCount: 0
  maxReplicaCount: ${STANDBY_MAX_REPLICAS:=1}
  # Seconds without requests before scaling to zero.
  cooldownPeriod: ${STANDBY_COOLDOWN:=300}
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda-system:9090
        interceptorRoute: ${STANDBY_APP}
