---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openshell-gateway
spec:
  interval: 1h
  path: ./kubernetes/apps/openshell/gateway/app
  prune: true
  targetNamespace: openshell
  dependsOn:
    - name: openshell-agent-sandbox
    - name: openshell-sandboxes
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openshell
      namespace: openshell
  wait: false
  timeout: 10m
