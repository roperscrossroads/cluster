---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openshell
spec:
  interval: 1h
  chart:
    spec:
      chart: helm-chart
      version: "0.0.116"
      sourceRef:
        kind: HelmRepository
        name: openshell
      interval: 1h
  values:
    image:
      repository: ghcr.io/nvidia/openshell/gateway
      tag: "0.0.116"
      pullPolicy: IfNotPresent
    supervisor:
      image:
        repository: ghcr.io/nvidia/openshell/supervisor
        tag: "0.0.116"
      sideloadMethod: "image-volume"      # k8s 1.36 ⇒ ImageVolume GA (verified on cluster)
    # --- TLS + JWT: self-contained self-signed pkiInitJob (internal mTLS control plane) ---
    pkiInitJob:
      enabled: true
    certManager:
      enabled: false
    server:
      dbUrl: "sqlite:/var/openshell/openshell.db"   # gateway PVC (1Gi, cluster-default SC)
      logLevel: info
      disableTls: false
      # --- Auth (milestone 1): transport mTLS stays on (the server always terminates mTLS),
      # so only holders of the pki-minted client cert can connect — effectively single-operator.
      # We skip per-user identity here; OIDC (Authelia) is a follow-up milestone. ---
      auth:
        allowUnauthenticatedUsers: true
      # --- Kubernetes sandbox driver ---
      sandboxNamespace: openshell-sandboxes
      enableUserNamespaces: true                     # confirmed working on Talos
      sandboxImage: "ghcr.io/nvidia/openshell-community/sandboxes/base:latest"
      sandboxImagePullPolicy: IfNotPresent
      workspaceDefaultStorageSize: "10Gi"
      # grpcEndpoint empty → auto: https://openshell.openshell.svc.cluster.local:8080
    grpcRoute:
      enabled: false                                 # M1: port-forward; GRPCRoute deferred
    # --- gateway pinned to the dedicated sandbox node via label + toleration ---
    nodeSelector:
      openshell.io/sandboxes: "true"
    tolerations:
      - key: "openshell.io/sandboxes"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        memory: "512Mi"
  # Attach the internal-Zot pull secret to the chart-managed sandbox SA so BYOC
  # sandbox pods (e.g. Hermes, Phase B) can pull from the auth-required registry.
  # The chart exposes no sandbox-SA imagePullSecret value and the SA is Helm-managed,
  # so we inject it via a postRenderer (same pattern as the dagu HelmRelease).
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: ServiceAccount
              name: openshell-sandbox
              namespace: openshell-sandboxes
            patch: |
              - op: add
                path: /imagePullSecrets
                value:
                  - name: internal-registry-auth
