---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openshell
spec:
  interval: 1h
  chart:
    spec:
      chart: helm-chart
      version: "0.1.8"
      sourceRef:
        kind: HelmRepository
        name: openshell
      interval: 1h
  # Values follow the 0.1.x chart schema (rewritten for 0.1.7; the 0.0.x keys
  # image:, server.sandboxImage, supervisor.sideloadMethod are gone).
  values:
    # 0.1.x values schema. Images keep full repository paths (Renovate tracks the
    # repository+tag pairs), so the chart's ghcr.io/nvidia global registry prefix is
    # cleared to avoid ghcr.io/nvidia/ghcr.io/nvidia/... references.
    global:
      image:
        registry: ""
        pullPolicy: IfNotPresent
    gateway:
      image:
        repository: ghcr.io/nvidia/openshell/gateway
        tag: "0.1.8"
    supervisor:
      image:
        repository: ghcr.io/nvidia/openshell/supervisor
        tag: "0.1.8"
    sandboxRuntime:
      image:
        repository: ghcr.io/nvidia/openshell/sandbox
        tag: "0.1.8"
    # Default sandbox image (was server.sandboxImage); keep the community base image
    # rather than the chart's new nvcr.io ubuntu default.
    sandbox:
      image:
        repository: ghcr.io/nvidia/openshell-community/sandboxes/base
        tag: latest
        pullPolicy: IfNotPresent
    # --- TLS + JWT: self-contained self-signed pkiInitJob (internal mTLS control plane) ---
    pkiInitJob:
      enabled: true
    certManager:
      enabled: false
    server:
      dbUrl: "sqlite:/var/openshell/openshell.db"   # gateway PVC (1Gi, cluster-default SC)
      logLevel: info
      disableTls: false
      # Transport mTLS stays on; per-user identity (OIDC via Authelia) is a follow-up.
      auth:
        allowUnauthenticatedUsers: true
      # --- Kubernetes sandbox driver ---
      sandboxNamespace: openshell-sandboxes
      enableUserNamespaces: true                     # confirmed working on Talos
      workspaceDefaultStorageSize: "10Gi"
      # Pull secret for BYOC sandbox images on the internal registry (replaces the
      # 0.0.x postRenderer patch on the sandbox ServiceAccount).
      sandboxImagePullSecrets:
        - name: internal-registry-auth
    grpcRoute:
      enabled: false                                 # port-forward only; GRPCRoute deferred
    # --- gateway pinned to the sandbox node via label + toleration ---
    nodeSelector:
      openshell.io/sandboxes: "true"
    tolerations:
      - key: "openshell.io/sandboxes"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        memory: "512Mi"
