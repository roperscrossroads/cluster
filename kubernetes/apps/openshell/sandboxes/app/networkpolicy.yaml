---
# Coarse k8s egress backstop for sandbox pods. The REAL egress gate is OpenShell's own
# per-binary L7 sandbox policy (operator decision 2026-05-31) — this layer just permits the
# ports that policy needs (DNS, the gateway, and HTTPS), and denies everything else at L4.
# Allowing 443-to-any is intentional: it lets subscription coding CLIs (Claude Code →
# api.anthropic.com, Copilot → *.githubcopilot.com) and the internal LiteLLM endpoint reach
# out, while OpenShell's supervisor restricts WHICH binaries may reach WHICH hosts at L7.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-egress-lockdown
  namespace: openshell-sandboxes
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to: []                      # DNS
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:                         # the gateway (supervisor mTLS callback)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshell
      ports:
        - protocol: TCP
          port: 8080
    - to: []                      # HTTPS — gated per-binary/per-host by OpenShell's L7 policy
      ports:
        - protocol: TCP
          port: 443
