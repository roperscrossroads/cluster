---
# Pin: bump tag here on chart upgrade; image tag (Immich app version)
# lives in helmrelease.yaml values and tracks separately (chart doesn't
# bump 1:1 with app).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: immich
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.13.1
  url: oci://ghcr.io/immich-app/immich-charts/immich
