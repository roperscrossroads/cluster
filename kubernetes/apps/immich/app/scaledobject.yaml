---
# KEDA keeps immich-machine-learning pinned at 1 replica always.
# ScaledObject stays in place so we can scale up to 2+ during heavy
# upload bursts in future (just bump maxReplicaCount). Triggers are
# OR-combined: any non-empty queue would scale up within the band.
#
# Why minReplicaCount=1 (not 0): scale-to-zero loses jobs. The server
# enqueues to BullMQ, which retries 3× over ~6s then marks the job
# failed. KEDA polls every 30s, so by the time the ML pod is starting
# the jobs are already dead. Empirically observed 2026-05-23: 22
# photos uploaded with thumbnails generated but ZERO ML (no faces, no
# CLIP, no OCR) because ML was at 0 replicas during the upload window.
#
# Queue key convention (verified empirically against the live valkey
# instance and Immich v2.7.5 source at
# server/src/repositories/config.repository.ts:283):
#   prefix:       immich_bull
#   queue names:  camelCase enum values from server/src/enum.ts
#                 (ThumbnailGeneration → thumbnailGeneration, etc.)
#   waiting list: <prefix>:<queueName>:wait   (BullMQ built-in suffix
#                 — KEDA reads LLEN on this list)
#
# ML-bound queues (all hit machineLearningRepository in the server):
#   - thumbnailGeneration  (media.service.ts — thumbnail/preview ML)
#   - faceDetection        (person.service.ts — face detection model)
#   - smartSearch          (smart-info.service.ts — CLIP embeddings)
#   - duplicateDetection   (duplicate.service.ts — uses CLIP)
#   - ocr                  (ocr.service.ts — OCR model)
#
# facialRecognition runs after faceDetection but is just pgvector
# clustering (no ML call), so it's excluded here — it doesn't need the
# ML container running.
#
# Cold-start cost: not paid in steady state (pinned at 1). Would only
# resurface if we re-enable scale-to-zero — ~10-30s (image pull
# cached; ONNX model load is the slow part).
#
# Tuning levers if behaviour is wrong:
#   - need more parallelism   → raise maxReplicaCount (currently 1)
#   - perceived latency spike → lower pollingInterval (currently 30s)
#   - queue diagnostics       → `valkey-cli LLEN immich_bull:<q>:wait`
#
# No TriggerAuthentication needed — valkey is unauthenticated inside
# the cluster (chart default; not exposed beyond the namespace).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: immich-ml
  namespace: immich
spec:
  scaleTargetRef:
    name: immich-machine-learning
  minReplicaCount: 1  # always-on: scale-to-zero drops jobs (BullMQ retries 3×/~6s then fails; KEDA's 30s poll loses the race)
  maxReplicaCount: 1
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    # FQDN required: keda-operator runs in keda-system namespace, so a
    # bare `immich-valkey` hostname fails DNS resolution.
    - type: redis
      metadata:
        address: immich-valkey.immich.svc.cluster.local:6379
        listName: immich_bull:thumbnailGeneration:wait
        listLength: "1"
    - type: redis
      metadata:
        address: immich-valkey.immich.svc.cluster.local:6379
        listName: immich_bull:faceDetection:wait
        listLength: "1"
    - type: redis
      metadata:
        address: immich-valkey.immich.svc.cluster.local:6379
        listName: immich_bull:smartSearch:wait
        listLength: "1"
    - type: redis
      metadata:
        address: immich-valkey.immich.svc.cluster.local:6379
        listName: immich_bull:duplicateDetection:wait
        listLength: "1"
    - type: redis
      metadata:
        address: immich-valkey.immich.svc.cluster.local:6379
        listName: immich_bull:ocr:wait
        listLength: "1"
