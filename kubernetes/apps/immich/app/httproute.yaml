---
# Internal-only HTTPRoute via envoy-internal. Public DNS A record points
# at the RFC1918 LB IP — resolvable from the internet, unreachable from
# it. Wildcard `*.${SECRET_DOMAIN}` cert at the Gateway covers TLS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - immich.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: immich-server
          port: 2283
