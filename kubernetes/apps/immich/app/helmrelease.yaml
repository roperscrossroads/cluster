---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    # Shared across all components (server, machine-learning, valkey).
    # The bjw-s common library propagates these to every sub-chart.
    controllers:
      main:
        containers:
          main:
            image:
              tag: v2.7.5
            env:
              REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: user
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: dbname

    immich:
      # Rendered into the immich-config.yaml ConfigMap by the chart and
      # mounted at /config/. Seeds Immich's persistent system config so
      # share-link / email / mobile sharing URLs are correct on first
      # boot. Admin UI changes still take precedence later.
      configuration:
        server:
          externalDomain: "https://immich.ropxr.dev"
      persistence:
        library:
          existingClaim: immich-library

    # Bundled valkey, but PVC-backed so queued jobs survive pod restart.
    # Without this, jobs get an emptyDir and the queue evaporates on
    # pod restart.
    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              # Tiny queue process. No CPU limit on purpose — CPU
              # throttling on something this small only adds latency
              # risk for no real benefit.
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
      persistence:
        data:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-valkey-data

    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                pullPolicy: IfNotPresent
              # Node.js + ffmpeg for video transcode. Headroom for
              # transcode spikes but capped so it can't OOM-kill
              # co-tenants on the node.
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
                HF_XET_CACHE: /cache/huggingface-xet
                MPLCONFIGDIR: /cache/matplotlib-config
              # PyTorch inference, models held in memory.
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-ml-cache
