---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-pet-tagger
spec:
  interval: 1h
  path: ./kubernetes/apps/immich/pet-tagger/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  dependsOn:
    # Pet-tagger can run with Immich-server unhealthy, but there's no point —
    # every API call would 5xx. Wait for the main app so logs are cleaner.
    - name: immich
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: immich
  wait: false
