---
# PHASE 2 (active 2026-06-03): every 6 hours, run one poll cycle (process new
# photos since last_timestamp, tag them, exit). Now UNSUSPENDED with the
# Deployment scaled to 0 — enrolment is stable enough to trust unattended
# runs. To go back to interactive enrolment, scale the Deployment to 1; this
# CronJob can keep running (concurrencyPolicy: Forbid means a manual UI poll
# and a cron firing won't both scan at once).
#
# "Run if you can, but it's not that important" semantics come from:
#   1. priorityClassName: low-priority-preemptible
#      - never preempts other pods to start
#      - first to be evicted under node memory pressure
#   2. concurrencyPolicy: Forbid
#      - if a previous run is still going, skip this firing entirely
#   3. startingDeadlineSeconds: 600
#      - if the cron controller can't launch within 10 min of the
#        schedule, give up on this firing (the next 6-hour tick gets a
#        fresh attempt)
#   4. activeDeadlineSeconds: 1800 on the JobSpec
#      - if the pod can't actually scan + finish in 30 min (e.g. stuck
#        Pending because the cluster is full), kill it. With cron firing
#        every 6 hours, missing one is fine — the next run picks up where
#        last_timestamp left off.
#
# Entrypoint: a small inline Python wrapper that imports the same modules
# the upstream main.py uses, runs ONE poll cycle, and exits. The classifier
# is rebuilt from refs on disk every cycle (poller.py:136), so there is
# no warm in-process state we lose by exiting.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-pet-tagger-poll
  namespace: immich
spec:
  schedule: "17 */6 * * *"       # every 6h at :17 (offset from common cron storms)
  timeZone: America/New_York
  suspend: false                 # Phase 2 active (2026-06-03)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1            # one retry then give up; next tick is in 6h anyway
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          priorityClassName: low-priority-preemptible
          # Same anti-affinity as the Deployment: prefer a node not
          # running immich-server. Cluster only has 3 nodes; pet-tagger
          # work is heavy enough that colocation hurts both sides.
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    # bjw-s common chart sets name=server, instance=immich
                    # (not name=immich-server). Both labels required so we
                    # don't accidentally match any other "server"-named pod.
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: server
                        app.kubernetes.io/instance: immich
          containers:
            - name: pet-tagger
              image: ghcr.io/tedornitier/immich-pet-tagger:cpu
              imagePullPolicy: IfNotPresent
              # Override CMD: one cycle, then exit. Imports are the same
              # ones main.py uses; state.init() is safe to call outside an
              # event loop on Python 3.12.
              command: ["python", "-u", "-c"]
              args:
                - |
                  import state
                  from pathlib import Path
                  from embedder import load_embed_cache
                  from poller import run_poll_cycle, migrate_ref_bboxes
                  state.init()
                  load_embed_cache(Path("/data"))
                  migrate_ref_bboxes(Path("/data"))
                  run_poll_cycle("/data")
              workingDir: /app
              env:
                - name: TZ
                  value: America/New_York
                - name: IMMICH_URL
                  value: http://immich-server.immich.svc.cluster.local:2283
                - name: IMMICH_EXTERNAL_URL
                  value: https://immich.${SECRET_DOMAIN}
                - name: GPU_WORKERS
                  value: "1"
                - name: YOLO_INPUT_SIZE
                  value: "640"
                - name: THRESHOLD
                  value: "0.8"
                # POLL_INTERVAL is unused in one-shot mode but kept for
                # parity with the Deployment's env.
                - name: POLL_INTERVAL
                  value: "300"
              envFrom:
                - secretRef:
                    name: immich-pet-tagger
              volumeMounts:
                - { name: data,  mountPath: /data }
                - { name: cache, mountPath: /root/.cache }
              resources:
                requests:
                  # Low requests = scheduler finds a slot more easily,
                  # which matters for the "run if you can" promise.
                  cpu: 200m
                  memory: 800Mi
                limits:
                  # Matches deployment.yaml: 3 cores on a 4-core N100 leaves
                  # headroom for system + co-tenants. Cronjob runs are
                  # short, so the CPU bump translates directly to faster
                  # job completion (and a sooner-released slot).
                  cpu: "3"
                  # 2500Mi OOM-killed during active scans, 4Gi gives real
                  # headroom under CLIP + YOLO + 8 concurrent thumbnail
                  # decode load.
                  memory: 4Gi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: immich-pet-tagger-data
            - name: cache
              persistentVolumeClaim:
                claimName: immich-pet-tagger-cache
