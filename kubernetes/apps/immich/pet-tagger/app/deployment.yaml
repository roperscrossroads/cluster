---
# PHASE 2 (current, 2026-06-03): replicas=0. Enrolment is stable, so the UI +
# built-in 5-minute polling loop are parked and the sibling CronJob (now
# unsuspended) handles unattended tagging every 6h. Scale back to 1 briefly
# when you want the interactive UI to enrol new pets, gather refs, or add
# negatives — then return to 0.
#
# Rationale for parking it: this single replica held a persistent ~2 GiB on
# talos-3 (the 12 GiB worker, already at ~91% memory requests) just to idle
# between enrolment sessions. The CronJob does the same work on demand.
#
# Note: this Deployment does NOT use low-priority-preemptible. While the UI
# is up it's interactive — you don't want it evicted mid-enrolment. The
# polite-priority pattern is reserved for the CronJob.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-pet-tagger
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-pet-tagger
spec:
  replicas: 0
  strategy:
    type: Recreate              # single RWX mount; no rolling updates
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-pet-tagger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-pet-tagger
    spec:
      restartPolicy: Always
      # Soft anti-affinity: prefer a node that ISN'T running immich-server.
      # pet-tagger and immich-server are both CPU-heavy and the cluster
      # only has 3 nodes — without this, scheduler had us share talos-3
      # with immich-server (node at 85% CPU) while talos-1/2 sat at ~15%.
      # `preferred` not `required` so a single node failure doesn't
      # leave us un-schedulable.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                # bjw-s common chart sets name=server, instance=immich
                # (not name=immich-server). Both labels required so we
                # don't accidentally match any other "server"-named pod.
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: server
                    app.kubernetes.io/instance: immich
      containers:
        - name: pet-tagger
          image: ghcr.io/tedornitier/immich-pet-tagger:cpu
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TZ
              value: America/New_York
            - name: IMMICH_URL
              value: http://immich-server.immich.svc.cluster.local:2283
            - name: IMMICH_EXTERNAL_URL
              value: https://immich.ropxr.dev
            - name: POLL_INTERVAL
              value: "300"        # 5 min — matches upstream default during enrolment
            - name: GPU_WORKERS
              value: "1"          # CPU-only; a second worker just duplicates models in RAM
            - name: YOLO_INPUT_SIZE
              value: "640"
            - name: THRESHOLD
              value: "0.8"
          envFrom:
            - secretRef:
                name: immich-pet-tagger
          volumeMounts:
            - { name: data,  mountPath: /data }
            - { name: cache, mountPath: /root/.cache }
          # Under active scan (CLIP + YOLO + 8 concurrent thumbnail decodes
          # via SCAN_WORKERS default), the pod climbs past 2 GiB. Initial
          # 2500Mi limit OOM-killed mid-enrolment 2026-05-24, exit 137.
          # 4Gi gives real headroom while still capping at 1/4 of a 16 GiB
          # node so co-tenants can't be starved.
          resources:
            requests:
              cpu: 300m
              memory: 1500Mi
            limits:
              # 3 cores on a 4-core N100 leaves 1 core headroom for the
              # system + co-tenants. Combined with the anti-affinity
              # above, this gives real throughput instead of fighting
              # immich-server for the same 2 cores.
              cpu: "3"
              memory: 4Gi
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30   # CLIP cold-load takes ~20-30s on N100 CPU
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-pet-tagger-data
        - name: cache
          persistentVolumeClaim:
            claimName: immich-pet-tagger-cache
