---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich

resources:
  - ./priorityclass.yaml
  - ./secret.sops.yaml
  - ./data-pvc.yaml
  - ./cache-pvc.yaml
