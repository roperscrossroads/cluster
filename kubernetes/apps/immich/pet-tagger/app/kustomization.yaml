  - ./deployment.yaml
  - ./cronjob.yaml

# InterceptorRoute (with a static /health answer at zero), the HTTPRoute to
# the interceptor and the daily wake check. The ScaledObject is in ../scaling.
components:
  - ../../../../components/standby
