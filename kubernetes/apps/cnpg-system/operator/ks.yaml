---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/cnpg-system/operator/app
  dependsOn:
    - name: cnpg-operator-crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cnpg-system
  wait: false
