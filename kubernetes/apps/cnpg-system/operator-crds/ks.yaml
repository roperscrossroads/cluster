---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-operator-crds
spec:
  interval: 1h
  path: ./kubernetes/apps/cnpg-system/operator-crds/app
  # prune:false — never let renaming/moving this Kustomization
  # cascade-delete every Cluster / Backup / Pooler CR in the estate.
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cnpg-system
  # wait:true so the operator HelmRelease can dependsOn this and Flux
  # blocks until the CRDs exist.
  wait: true
