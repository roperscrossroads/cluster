---
# Internal gateway only. The backend is the add-on's interceptor proxy in
# keda-system (allowed by the ReferenceGrant in keda-system/http-add-on),
# which holds the request while KEDA scales echo-standby up from zero.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-standby
spec:
  hostnames: ["echo-standby-int.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda-system
          port: 8080
