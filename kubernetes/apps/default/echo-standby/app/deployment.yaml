---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-standby
  labels:
    app.kubernetes.io/name: echo-standby
spec:
  # No `replicas`: KEDA owns the count (0 when idle). Flux leaves it alone.
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-standby
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-standby
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: app
          # Same image as default/echo, so nodes already have it cached
          # and a cold start measures the app, not an image pull.
          image: ghcr.io/mendhak/http-https-echo:43
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: LOG_WITHOUT_NEWLINE
              value: "true"
            - name: LOG_IGNORE_PATH
              value: /healthz
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 64Mi
