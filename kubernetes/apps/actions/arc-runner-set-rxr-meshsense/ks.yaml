---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arc-runner-set-rxr-meshsense
spec:
  dependsOn:
    - name: arc-controller
  interval: 1h
  path: ./kubernetes/apps/actions/arc-runner-set-rxr-meshsense/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: arc-runners
