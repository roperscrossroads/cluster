---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set-rxr-meshsense
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
  interval: 1h
  values:
    # Pin the controller ServiceAccount explicitly so the chart's
    # manager_role_binding template skips its live-cluster discovery
    # (lookup by label app.kubernetes.io/part-of=gha-rs-controller). That
    # discovery aborts under offline rendering (flate test / helm
    # template), and pinning is also more robust than relying on a runtime
    # lookup. Values match the deployed arc-controller release.
    controllerServiceAccount:
      name: arc-controller-gha-rs-controller
      namespace: arc-systems

    githubConfigUrl: "https://github.com/roperscrossroads/meshsense-docker-arm64"
    githubConfigSecret: arc-runner-set-rxr-meshsense-github
    runnerScaleSetName: meshsense-arc
    minRunners: 0
    maxRunners: 4

    # See arc-runner-set-rxr-homelab/helmrelease.yaml for the rationale on
    # non-container-mode (Talos+kubelet subPath quirk).
    template:
      spec:
        serviceAccountName: arc-runner-set-rxr-meshsense
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
