---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set-rxr-meshsense
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
  interval: 1h
  values:
    githubConfigUrl: "https://github.com/roperscrossroads/meshsense-docker-arm64"
    githubConfigSecret: arc-runner-set-rxr-meshsense-github
    runnerScaleSetName: meshsense-arc
    minRunners: 0
    maxRunners: 4

    # See arc-runner-set-rxr-homelab/helmrelease.yaml for the rationale on
    # non-container-mode (Talos+kubelet subPath quirk).
    template:
      spec:
        serviceAccountName: arc-runner-set-rxr-meshsense
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
