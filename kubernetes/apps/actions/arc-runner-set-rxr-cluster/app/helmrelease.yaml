---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set-rxr-cluster
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
  interval: 1h
  values:
    # Pin the controller ServiceAccount explicitly so the chart's
    # manager_role_binding template skips its live-cluster discovery
    # (lookup by label app.kubernetes.io/part-of=gha-rs-controller). That
    # discovery aborts under offline rendering (flate test / helm
    # template), and pinning is also more robust than relying on a runtime
    # lookup. Values match the deployed arc-controller release.
    controllerServiceAccount:
      name: arc-controller-gha-rs-controller
      namespace: arc-systems

    githubConfigUrl: "https://github.com/roperscrossroads/cluster"
    githubConfigSecret: arc-runner-set-rxr-cluster-github
    runnerScaleSetName: cluster-arc
    minRunners: 0
    # Only the smoke workflow targets this set; one runner is enough.
    maxRunners: 1

    # Non-container-mode: jobs run directly on the runner pod (no separate
    # workflow pod). Each runner pod is --ephemeral (chart-default), so
    # one pod = one job, deleted on completion.
    #
    # Why not container-mode: bundled hooks (v0.7.0 in actions-runner:latest)
    # mount work-PVC at /__e via subPath=externals, which kubelet silently
    # drops on Talos overlayfs. We tried overriding via a hook-template
    # ConfigMap (ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE) but K8s pod-spec
    # validation rejects duplicate mountPaths in a single container, and we
    # can't remove the bundled mount through the merge logic. Sticking with
    # non-container-mode aligns with how ARC is run on Talos in the wild
    # (ref: oneuptime.com Talos runner guide). For workflows that need
    # tooling beyond the actions-runner image, use a custom runner image
    # (set runnerImage at the chart values level) or rely on actions to
    # install what they need.
    # The always-on listener that holds the job queue connection to GitHub.
    # Uses ~10Mi; the request keeps it counted by the scheduler.
    listenerTemplate:
      spec:
        containers:
          - name: listener
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }

    template:
      spec:
        serviceAccountName: arc-runner-set-rxr-cluster
        # Runners never preempt services and are evicted first under node
        # memory pressure (see the ci-runner PriorityClass in arc-controller).
        priorityClassName: ci-runner
        containers:
          - name: runner
            # Tag + digest: the digest fixes the image, the tag lets Renovate
            # propose bumps. GitHub refuses jobs to runners too far behind the
            # latest release, so merge runner bumps promptly.
            image: ghcr.io/actions/actions-runner:2.338.2@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
            command: ["/home/runner/run.sh"]
            # Sized from 30 days of runs (images builds peak ~690Mi, ~0.3 core).
            # The request is what the scheduler reserves, so a burst of jobs
            # queues as Pending instead of piling onto one node. No CPU limit:
            # CPU is shared by request weight under contention, and a limit
            # would only throttle builds while cores sit idle. Ephemeral storage
            # is the node's shared working disk; the limit stops one build
            # filling it.
            resources:
              requests: { cpu: 250m, memory: 768Mi, ephemeral-storage: 2Gi }
              limits: { memory: 2Gi, ephemeral-storage: 10Gi }
