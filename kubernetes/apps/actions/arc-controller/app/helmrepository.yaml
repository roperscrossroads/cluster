---
# Public OCI charts published by the actions/actions-runner-controller project.
# No auth required for pull.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: actions-runner-controller
  # Explicit (ks.yaml's targetNamespace already puts it here) so Renovate can
  # resolve the runner sets' cross-namespace sourceRef to this repository;
  # without it the four gha-runner-scale-set charts were never detected.
  namespace: arc-systems
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/actions/actions-runner-controller-charts
