---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
spec:
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
  interval: 1h
  values:
    # Single replica is fine for our scale; bump + leader-elect later if needed.
    replicaCount: 1
    # Listener pods are created by the controller in the runner-set namespace,
    # not here. Hardening lives on the runner-set HelmRelease.
