---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runner-image-automation
spec:
  interval: 1h
  path: ./kubernetes/apps/actions/runner-image-automation/app
  postBuild:
    # Required: resolves ${SECRET_DOMAIN} in the ImageRepository image ref.
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Image-automation objects live in flux-system (where the controllers run).
  targetNamespace: flux-system
