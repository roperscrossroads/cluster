---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-runner
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: forgejo-runner
      namespace: actions
  healthCheckExprs:
    - apiVersion: apps/v1
      kind: Deployment
      failed: status.replicas != status.updatedReplicas
      current: spec.replicas == 0 || status.availableReplicas == status.replicas
  interval: 1h
  path: ./kubernetes/apps/actions/forgejo-runner/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      # RUNNER_BASE_TAG — image-automation updates this ConfigMap. Optional so a
      # missing CM falls back to the deployment's :=default instead of failing.
      - name: forgejo-runner-image
        kind: ConfigMap
        optional: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: actions
