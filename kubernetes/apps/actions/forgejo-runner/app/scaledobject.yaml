---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: forgejo-runner-auth
spec:
  secretTargetRef:
    - parameter: token
      name: forgejo-runner
      key: api-token
---
# Scale to zero when no k8s-labelled jobs are queued. Was pinned at 1 until
# 2026-11: KEDA 2.19's forgejo-runner scaler always reported IsActive=true, so
# it never scaled down. Fixed in the KEDA we run (2.21.0 returns
# len(jobList) > 0). Cold start = pod start + runner registration.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: forgejo-runner
spec:
  scaleTargetRef:
    name: forgejo-runner
  minReplicaCount: 0
  maxReplicaCount: 3
  pollingInterval: 30
  cooldownPeriod: 120
  triggers:
    - type: forgejo-runner
      authenticationRef:
        name: forgejo-runner-auth
      metadata:
        address: http://172.16.20.16:3000
        global: 'false'
        org: dev
        labels: k8s
        name: forgejo-runner-k8s
