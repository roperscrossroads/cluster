---
# Lets HTTPRoutes in the listed namespaces send traffic to the interceptor
# proxy here. Add a namespace when a standby app lands in it.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: interceptor-proxy
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: immich
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: inference
  to:
    - group: ""
      kind: Service
      name: keda-add-ons-http-interceptor-proxy
