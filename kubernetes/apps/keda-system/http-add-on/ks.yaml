---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: http-add-on
spec:
  # The interceptor fleet is itself scaled by a KEDA ScaledObject, so KEDA
  # core (and its CRDs) must be up first.
  dependsOn:
    - name: keda
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: keda-add-ons-http
      namespace: keda-system
  interval: 1h
  path: ./kubernetes/apps/keda-system/http-add-on/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: keda-system
