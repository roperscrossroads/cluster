---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  chart:
    spec:
      chart: keda
      version: 2.21.1
      sourceRef:
        kind: HelmRepository
        name: keda
  interval: 1h
  values:
    prometheus:
      metricServer:
        enabled: false
      # The operator's own metrics: per-ScaledObject errors, scaler
      # activity and the scale-loop latency. Scraped by the chart's
      # PodMonitor; the label makes Prometheus select it. Rules on them live
      # in prometheusrule.yaml.
      operator:
        enabled: true
        podMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
