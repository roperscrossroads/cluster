---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  chart:
    spec:
      chart: keda
      version: 2.20.2
      sourceRef:
        kind: HelmRepository
        name: keda
  interval: 1h
  values:
    prometheus:
      metricServer:
        enabled: false
      operator:
        enabled: false
