---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.31/deploy/local-path-storage.yaml
patches:
  # Talos: provision under /var, which the kubelet bind-mounts from the host
  # (talos/patches/global/machine-kubelet.yaml extraMounts). The upstream
  # default /opt/local-path-provisioner lives inside the kubelet container,
  # so a kubelet restart or Talos upgrade orphans the data.
  - target:
      kind: ConfigMap
      name: local-path-config
    patch: |-
      - op: replace
        path: /data/config.json
        value: |-
          {
            "nodePathMap": [
              {
                "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                "paths": ["/var/local-path-provisioner"]
              }
            ]
          }
