---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-zfs-nfs-2
spec:
  interval: 1h
  chart:
    spec:
      chart: democratic-csi
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: democratic-csi-zfs-nfs-2
  values:
    csiDriver:
      name: org.democratic-csi.zfs-nfs-2
    driver:
      # NOTE: existingConfigSecret MUST stay inside the driver: block.
      # Top-level values.existingConfigSecret is silently ignored by the
      # democratic-csi chart (which then auto-generates an empty driver
      # config Secret and the controller fails). See infra-new
      # tmp-phase5-issues.md issue #2 for context.
      existingConfigSecret: democratic-csi-zfs-nfs-2-config
      config:
        driver: zfs-generic-nfs
    storageClasses:
      - name: zfs-nfs-2
        defaultClass: false
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
        mountOptions:
          - noatime
          - nfsvers=4.2
    controller:
      driver:
        image:
          tag: v1.9.5
    node:
      driver:
        image:
          tag: v1.9.5
  # See democratic-csi-zfs-nfs-1/app/helmrelease.yaml for rationale
  # (driver-registrar probe bump + controller soft anti-affinity).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: democratic-csi-zfs-nfs-2-node
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: democratic-csi-zfs-nfs-2-node
              spec:
                template:
                  spec:
                    containers:
                    - name: driver-registrar
                      livenessProbe:
                        timeoutSeconds: 5
          - target:
              kind: Deployment
              name: democratic-csi-zfs-nfs-2-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: democratic-csi-zfs-nfs-2-controller
              spec:
                template:
                  spec:
                    affinity:
                      podAntiAffinity:
                        preferredDuringSchedulingIgnoredDuringExecution:
                          - weight: 100
                            podAffinityTerm:
                              topologyKey: kubernetes.io/hostname
                              labelSelector:
                                matchLabels:
                                  app.kubernetes.io/name: democratic-csi
                                  app.kubernetes.io/csi-role: controller
