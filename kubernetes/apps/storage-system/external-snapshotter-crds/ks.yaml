---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-snapshotter-crds
spec:
  interval: 1h
  path: ./kubernetes/apps/storage-system/external-snapshotter-crds/app
  # prune:false — never let renaming/moving this Kustomization
  # cascade-delete every VolumeSnapshot in the estate.
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: storage-system
  wait: true
