---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-snapshotter
spec:
  interval: 1h
  path: ./kubernetes/apps/storage-system/external-snapshotter/app
  dependsOn:
    - name: external-snapshotter-crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: storage-system
  wait: true
