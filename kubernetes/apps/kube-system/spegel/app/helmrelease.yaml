---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  chartRef:
    kind: OCIRepository
    name: spegel
  interval: 1h
  values:
    spegel:
      containerdSock: /run/containerd/containerd.sock
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
      # Keep Talos's machine-config mirrors as fallback hosts. Without
      # this, spegel replaces the per-registry hosts.toml with one that
      # only points back at itself, and any image not already on a node
      # 404s instead of falling through to the upstream registry. Hit
      # 2026-05-11 when pushing notes-rag-ingest:v0.2.3 to the internal
      # Zot: containerd asked spegel, spegel had no cached layer, and
      # nothing reached the real registry.
      prependExisting: true
      # Spegel had already moved the Talos-written
      # /etc/cri/conf.d/hosts/registry.home.arpa:8080/hosts.toml to
      # _backup/ before we set prependExisting=true, so it no longer
      # sees the upstream to preserve. List the internal registry
      # explicitly + add it as an additional mirror target so spegel
      # writes both itself AND the upstream into the per-host file.
      mirroredRegistries:
        - http://registry.home.arpa:8080
      additionalMirrorTargets:
        - http://registry.home.arpa:8080
    service:
      registry:
        hostPort: 29999
    serviceMonitor:
      enabled: true
