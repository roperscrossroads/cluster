---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: "10.43.0.10"
    replicaCount: 2
    servers:
      # Internal estate hosts on `home.arpa` are served by dnsmasq on
      # dnsdhcp-compute (172.16.20.40), which the talos /etc/resolv.conf
      # doesn't see (cluster nodes resolve via a public upstream).
      # Explicitly forward `home.arpa` so step pods can reach
      # webui.home.arpa, memtech-dashboard.home.arpa, etc., without
      # per-pod hostAliases. Block below (`.`) keeps handling everything
      # else via the default `forward . /etc/resolv.conf`.
      - zones:
          - zone: home.arpa
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: cache
            parameters: "30"
          - name: forward
            parameters: . 172.16.20.40
      # Internal `lab.ropxr.dev` services (litellm, engram, forge, git, …) are
      # the migration target off `home.arpa`: a real LE wildcard cert + a
      # split-horizon zone in OPNsense Unbound that returns RFC-1918 → Caddy
      # (public has no A record = home-network-only). The zone is served by
      # Unbound on every VLAN gateway, so forward to the cluster's own
      # same-VLAN gateway 172.16.21.1 (dnsdhcp/dnsmasq does NOT serve this
      # zone). Lets pods reach litellm.lab.ropxr.dev etc. with verifiable TLS
      # and no internal-CA-trust mounts.
      - zones:
          - zone: lab.ropxr.dev
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: cache
            parameters: "30"
          - name: forward
            parameters: . 172.16.21.1
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
