---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
spec:
  interval: 1h
  chart:
    spec:
      chart: ollama
      version: "1.56.0"
      sourceRef:
        kind: HelmRepository
        name: ollama
  values:
    replicaCount: 1

    image:
      repository: ollama/ollama
      pullPolicy: IfNotPresent

    ollama:
      port: 11434
      gpu:
        enabled: false
      # Override chart default (/root/.ollama). The upstream image runs as
      # uid 1000 (ubuntu) with HOME=/home/ubuntu and /root mode 0700; with
      # the default mountPath the PVC was mounted on a directory the runtime
      # user couldn't traverse, so Ollama wrote models to the container's
      # ephemeral overlayfs at $HOME/.ollama/models — meaning every pod
      # restart re-pulled the model. Mounting at $HOME/.ollama keeps the
      # PVC actually useful.
      mountPath: /home/ubuntu/.ollama
      models:
        # Pull the Q8_0 GGUF straight from HF (ggml-org's official quant).
        # Same weights as LM Studio serves on the GPU host -- keeps the
        # `embed-m3` LiteLLM group's primary + fallback paths in the same
        # vector space (verified at setup via cosine-sim probe).
        # Q8_0 on N100 also benefits from AVX-VNNI int8 acceleration and
        # halves the model buffer (~570 MiB vs F16's 1097 MiB), easing
        # the memory-bandwidth bottleneck identified in perf testing.
        pull:
          - hf.co/ggml-org/bge-m3-Q8_0-GGUF
        # Alias the HF-pulled model to the short name `bge-m3` so LiteLLM
        # and other callers can use `ollama/bge-m3` instead of the full
        # hf.co/... path.
        create:
          - name: bge-m3
            template: |
              FROM hf.co/ggml-org/bge-m3-Q8_0-GGUF
        clean: true

    # Pull happens via chart's postStart lifecycle hook (NOT an initContainer),
    # so the pod becomes Ready as soon as the HTTP server binds, racing the
    # pull. We push readiness/liveness initialDelaySeconds high so the Ready
    # signal lines up roughly with pull completion (~30-90s on warm registry,
    # up to a few minutes worst case for ~568 MB).
    livenessProbe:
      initialDelaySeconds: 240
    readinessProbe:
      initialDelaySeconds: 180

    extraEnv:
      # Keep bge-m3 warm forever — no cold-load on every cron tick
      - name: OLLAMA_KEEP_ALIVE
        value: "24h"
      # 2 concurrent embed slots — the per-pod throughput knee on N100.
      # Verified CPU-bound at ~3700m/4000m under load; PARALLEL=4 didn't
      # unlock more (only 4 vCPUs). Real ceiling is GPU; tracked separately.
      - name: OLLAMA_NUM_PARALLEL
        value: "2"
      # Forward-looking: when a small chat model joins, allow both warm
      - name: OLLAMA_MAX_LOADED_MODELS
        value: "2"
      # No-op for bge-m3 (encoder, no KV cache) — for future chat models
      - name: OLLAMA_FLASH_ATTENTION
        value: "1"
      # No-op for bge-m3 — for future chat models
      - name: OLLAMA_KV_CACHE_TYPE
        value: "q8_0"
      # Cap context (and thus n_batch / compute buffer) — bge-m3 was
      # padding every forward pass to 4096 tokens regardless of input
      # length. 512 covers OpenWebUI's typical chunk sizes with headroom
      # and shrinks the per-request compute buffer ~8x. Revisit if a
      # consumer needs longer context (RAG with bigger chunks).
      - name: OLLAMA_CONTEXT_LENGTH
        value: "512"

    resources:
      requests:
        cpu: 2000m
        memory: 4Gi
      limits:
        # No CPU limit on purpose — CFS throttling tanks bursty batched
        # embedding throughput on N100. Memory cap prevents runaway loads.
        memory: 8Gi

    persistentVolume:
      enabled: true
      storageClass: zfs-nvmeof-1
      size: 20Gi
      accessModes:
        - ReadWriteOnce

    # PSA: restricted compatibility — chart defaults both context blocks
    # to {}; we set them explicitly here.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      # PVC at /root/.ollama needs writes; chart's default mountPath assumes
      # this. Leaving rootFS writable keeps the chart's pull mechanism happy.
      readOnlyRootFilesystem: false

    terminationGracePeriodSeconds: 180

    # External HTTPRoute (httproute.yaml) — mirrors the dagu pattern.
    httpRoute:
      enabled: false
    knative:
      enabled: false
    autoscaling:
      enabled: false
    serviceAccount:
      create: true
