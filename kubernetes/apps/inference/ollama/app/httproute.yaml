---
# Internal-only ingress for cluster Ollama. Hostname resolves on public DNS
# (Cloudflare, via external-dns) but CNAMEs to internal.${SECRET_DOMAIN} ->
# the envoy-internal LB IP, unreachable from the internet. Consumers
# (LiteLLM on the proxy LXC) hit this route directly — no public-facing
# proxy in front. Authelia is intentionally NOT used here: Ollama lacks
# auth integration and Authelia is browser-SSO only, wrong tool for the
# programmatic API surface. NetworkPolicy gates abuse.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama
spec:
  hostnames: ["ollama-int.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: ollama
          port: 11434
