---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
spec:
  chartRef:
    kind: OCIRepository
    name: grafana-operator
  interval: 1h
  values:
    # ServiceMonitor for the operator itself so the kube-prom-stack
    # Prometheus picks up its metrics (reconcile counts, errors, etc.).
    serviceMonitor:
      enabled: true
    # The chart ships a Grafana dashboard for the operator metrics as a
    # ConfigMap; the sidecar pattern in our Grafana CR (label-matched
    # configMapRef) picks it up automatically.
    dashboard:
      enabled: true
