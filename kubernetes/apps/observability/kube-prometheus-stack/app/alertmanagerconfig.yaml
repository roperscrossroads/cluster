---
# Single ntfy webhook receiver — catches every alert and forwards to the
# `infra` topic. Refine with sub-routes later (e.g. storage/disk alerts →
# `storage` topic, security alerts → `security`).
#
# Targets the Caddy-fronted `ntfy.lab.${SECRET_DOMAIN}` name, which carries a
# real Let's Encrypt cert and so validates against the container's default
# trust store — no ca/configMap wiring needed here at all.
#
# The previous internal `.home.arpa` name bypassed Caddy and resolved straight
# to the ntfy host, which serves its OWN self-signed cert. Pinning the Caddy
# root as the trust anchor could therefore never validate it, and EVERY
# notification since this stack was deployed failed with x509 "certificate
# signed by unknown authority" — 81,170 of 81,176 attempts. Alerts fired
# correctly the whole time and died in the notifier, which is why a nightly
# backup-retention CronJob could fail 51 times unnoticed (beads agents-iw97,
# agents-j44z). Prefer the Caddy-fronted name for any internal webhook: it
# needs no custom CA and cannot drift out of trust.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
  namespace: observability
spec:
  route:
    receiver: ntfy-infra
    groupBy: [alertname, namespace, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    routes:
      # Never deliver these. InfoInhibitor is kube-prometheus-stack's internal
      # inhibition helper, not an incident. The overcommit / major-page-fault
      # alerts are informational on a 3-node cluster whose nodes differ in
      # size — they fired for days and resolved on their own without anyone
      # needing to act. Still visible in the Alertmanager/Prometheus UIs.
      - matchers:
          - name: alertname
            matchType: "=~"
            value: InfoInhibitor|KubeMemoryOvercommit|KubeCPUOvercommit|NodeMemoryMajorPagesFaults
        receiver: "null"
      # Watchdog fires forever by design — it is proof the pipeline is alive,
      # not an incident. Split it onto its own topic so the actionable feed
      # stays actionable, and so a SILENT `heartbeat` topic becomes the signal
      # that delivery has broken again. That is the missing check that let the
      # x509 failure above go unnoticed for the life of the cluster.
      - matchers:
          - name: alertname
            value: Watchdog
        receiver: ntfy-heartbeat
        repeatInterval: 24h
      # Every rule in this HelmRelease already carries a `severity` label
      # (critical: OomKilled, ZfsUnexpectedPoolState, PodCrashLooping,
      # CnpgWalArchivingFailing, CnpgWalReceiverDown; warning: everything
      # else) — this just routes on a label that was already there. Shares
      # the SAME physical ntfy topic as Kuma's `kuma-critical` channel (see
      # infra-new's sync-monitors.yml/uptime-kuma.md) — one "anything urgent"
      # mailbox across both alerting pipelines, part of the estate-wide
      # severity taxonomy from the 2026-09 design pass (agents-vjoy).
      - matchers:
          - name: severity
            value: critical
        receiver: ntfy-critical
        repeatInterval: 4h
  # The `tpl=1&t=…&m=…` query has ntfy render the Alertmanager webhook JSON
  # itself (ntfy message templates) instead of pushing the raw payload.
  # Decoded:
  #   title:   {{if eq .status "resolved"}}✅ Resolved{{else}}🔥 Firing{{end}}:
  #            {{.commonLabels.alertname}}{{with .commonLabels.namespace}} ({{.}}){{end}}
  #            {{if gt (len .alerts) 1}} ×{{len .alerts}}{{end}}
  #   message: {{range .alerts}}• {{or .annotations.summary .annotations.description
  #            .labels.alertname}}{{with .labels.pod}} [{{.}}]{{end}}\n{{end}}
  # Edit the decoded form, then re-encode with: jq -rn --arg s '<tpl>' '$s|@uri'
  receivers:
    - name: "null"
    - name: ntfy-infra
      webhookConfigs:
        - url: https://ntfy.lab.${SECRET_DOMAIN}/infra?tpl=1&t=%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7D%E2%9C%85%20Resolved%7B%7Belse%7D%7D%F0%9F%94%A5%20Firing%7B%7Bend%7D%7D%3A%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bwith%20.commonLabels.namespace%7D%7D%20%28%7B%7B.%7D%7D%29%7B%7Bend%7D%7D%7B%7Bif%20gt%20%28len%20.alerts%29%201%7D%7D%20%C3%97%7B%7Blen%20.alerts%7D%7D%7B%7Bend%7D%7D&m=%7B%7Brange%20.alerts%7D%7D%E2%80%A2%20%7B%7Bor%20.annotations.summary%20.annotations.description%20.labels.alertname%7D%7D%7B%7Bwith%20.labels.pod%7D%7D%20%5B%7B%7B.%7D%7D%5D%7B%7Bend%7D%7D%0A%7B%7Bend%7D%7D
          sendResolved: true
    - name: ntfy-heartbeat
      webhookConfigs:
        - url: https://ntfy.lab.${SECRET_DOMAIN}/heartbeat
          sendResolved: false
    - name: ntfy-critical
      webhookConfigs:
        - url: https://ntfy.lab.${SECRET_DOMAIN}/kuma-critical?p=5&tpl=1&t=%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7D%E2%9C%85%20Resolved%7B%7Belse%7D%7D%F0%9F%94%A5%20Firing%7B%7Bend%7D%7D%3A%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bwith%20.commonLabels.namespace%7D%7D%20%28%7B%7B.%7D%7D%29%7B%7Bend%7D%7D%7B%7Bif%20gt%20%28len%20.alerts%29%201%7D%7D%20%C3%97%7B%7Blen%20.alerts%7D%7D%7B%7Bend%7D%7D&m=%7B%7Brange%20.alerts%7D%7D%E2%80%A2%20%7B%7Bor%20.annotations.summary%20.annotations.description%20.labels.alertname%7D%7D%7B%7Bwith%20.labels.pod%7D%7D%20%5B%7B%7B.%7D%7D%5D%7B%7Bend%7D%7D%0A%7B%7Bend%7D%7D
          sendResolved: true
