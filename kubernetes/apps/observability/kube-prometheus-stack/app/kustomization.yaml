---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./alertmanagerconfig.yaml

# No internal-ca configMapGenerator here: the alertmanager webhook now targets
# the Caddy-fronted ntfy name, whose Let's Encrypt cert validates against the
# container's default trust store. See alertmanagerconfig.yaml for why the
# previous self-signed-vs-Caddy-root mismatch silently killed every alert.
