---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./alertmanagerconfig.yaml

# Internal Caddy CA — mounted into the alertmanager pod so its webhook
# calls to https://ntfy.home.arpa validate cleanly. Same pattern as
# notes-rag / notes-verifier.
configMapGenerator:
  - name: internal-ca
    files:
      - ca.crt=internal-ca.crt
    options:
      disableNameSuffixHash: true
