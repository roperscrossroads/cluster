---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    # CRDs are decoupled into kube-prometheus-stack-crds Flux Kustomization.
    # Upgrades become a re-vendor + apply, not a chart-hook gamble.
    crds:
      enabled: false

    # Cleaner object names — drops the redundant "kube-prometheus-stack-"
    # prefix on generated resources.
    cleanPrometheusOperatorObjectNames: true

    # Grafana lives in its own HelmRelease (grafana-operator) so the
    # actual Grafana instance + datasources + auth are managed there.
    #
    # forceDeployDashboards + the operator block below makes the chart
    # render its 30+ bundled k8s dashboards (apiserver, kubelet, nodes,
    # k8s-resources-*, prometheus self, etc.) as ConfigMaps with the
    # `dashboards: grafana` label — the grafana-operator instance
    # selector then picks them up as GrafanaDashboard refs without any
    # per-dashboard wiring on our side.
    grafana:
      enabled: false
      forceDeployDashboards: true
      forceDeployDatasources: false
      defaultDashboardsEnabled: true
      sidecar:
        dashboards:
          # The chart's bundled dashboards target the prometheus
          # datasource by name "Prometheus" (capitalized); our
          # GrafanaDatasource CR creates one called "prometheus".
          # multicluster keeps the cluster label substitution sane
          # for single-cluster deployments.
          multicluster:
            global:
              enabled: false
      operator:
        dashboardsConfigMapRefEnabled: true
        matchLabels:
          dashboards: grafana
        folder: kubernetes
        resyncPeriod: 10m

    # node-exporter + kube-state-metrics use simpler names than the chart
    # default (which prefixes with the release name).
    prometheus-node-exporter:
      fullnameOverride: node-exporter
    kube-state-metrics:
      fullnameOverride: kube-state-metrics

    # Talos uses Cilium kube-proxy replacement — nothing to scrape on the
    # kube-proxy job.
    kubeProxy:
      enabled: false
    # Control-plane jobs we never look at and which carry heavy histogram
    # cardinality. On Talos, controller-manager + scheduler bind to localhost
    # and aren't scrapable anyway; etcd is co-located with the apiserver pod.
    # Dropped to shed series. kube-state-metrics, node-exporter and kubelet
    # stay enabled — the OOM/ZFS/Dockerhub alert rules depend on them.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    # Keep the apiserver up/error signal but drop its highest-cardinality
    # bucket histograms (the dominant series source in most clusters).
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - action: drop
            sourceLabels: [__name__]
            regex: apiserver_request_duration_seconds_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_slo_duration_seconds_bucket

    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
      alertmanagerSpec:
        # References the AlertmanagerConfig CR shipped alongside this
        # HelmRelease (alertmanagerconfig.yaml). The CR carries the route
        # tree + ntfy webhook receiver.
        alertmanagerConfiguration:
          name: alertmanager
        externalUrl: https://alertmanager.${SECRET_DOMAIN}
        storage:
          volumeClaimTemplate:
            spec:
              # Node-local disk: Alertmanager state is tiny and disposable;
              # no reason to round-trip it over NVMe-oF to a shared target.
              storageClassName: local-path
              resources:
                requests:
                  storage: 1Gi
        # Internal Caddy CA for the ntfy webhook TLS is referenced
        # directly from the AlertmanagerConfig CR via the K8s-native
        # tlsConfig.ca.configMap field — the operator mounts the
        # ConfigMap into the Alertmanager pod itself. No manual
        # volumes/volumeMounts needed here.

    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
      prometheusSpec:
        externalUrl: https://prometheus.${SECRET_DOMAIN}
        # 60s (vs chart default 30s) halves sample volume → ~half the WAL
        # writes and compaction I/O. Ample resolution for a homelab that's
        # checked occasionally; slow-moving alerts (OOM, ZFS state) unaffected.
        scrapeInterval: 60s
        evaluationInterval: 60s
        # local-path pins the PVC to one node, so choose it deliberately:
        # the least-loaded worker, and explicitly NOT the node whose storage
        # layer has been unstable. (Prometheus crashed with EACCES writing to
        # a local-path volume on that node despite 0777/permissive-SELinux;
        # the same non-root pod runs fine here — see runbook follow-up.)
        nodeSelector:
          kubernetes.io/hostname: talos-3
        # The four *SelectorNilUsesHelmValues:false flags make Prom pick up
        # ANY ServiceMonitor / PodMonitor / Probe / PrometheusRule /
        # ScrapeConfig in any namespace, without a label restriction. This
        # is the right default for a homelab where monitors will be added
        # ad-hoc next to the workloads they cover.
        # Tighten selection back to label-gated defaults (avoid scraping any
        # PodMonitor/ServiceMonitor/etc. cluster-wide by default).
        podMonitorSelectorNilUsesHelmValues: true
        probeSelectorNilUsesHelmValues: true
        ruleSelectorNilUsesHelmValues: true
        scrapeConfigSelectorNilUsesHelmValues: true
        serviceMonitorSelectorNilUsesHelmValues: true
        retention: 7d
        # Hard cap on TSDB size. On local-path this is the ONLY real guard —
        # local-path enforces no quota, so retentionSize (not the PVC request)
        # is what protects the node's ephemeral partition from filling.
        retentionSize: 8GB
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
        # local-path is a hostPath volume, and the operator mounts the data
        # dir via subPath (prometheus-db). kubelet creates subPath dirs
        # root:root 0755 and does NOT apply fsGroup to them on hostPath
        # volumes — so non-root Prometheus (uid 1000) can't write and crashes
        # with EACCES on queries.active. (Block CSI like NVMe-oF avoided this
        # because ext4 volumes get fsGroup applied recursively.) This root
        # initContainer fixes ownership before the main container starts.
        initContainers:
          - name: init-chown-data
            image: public.ecr.aws/docker/library/busybox:1.38
            command: ["sh", "-c", "chown -R 1000:2000 /prometheus"]
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN"]
            volumeMounts:
              - name: prometheus-kube-prometheus-stack-db
                mountPath: /prometheus
                subPath: prometheus-db
        storageSpec:
          volumeClaimTemplate:
            spec:
              # Node-local NVMe instead of NVMe-oF: Prometheus does large
              # sequential TSDB I/O that thrashed the small shared target's
              # ARC. Data is disposable (survives upgrades, not node resets).
              storageClassName: local-path
              resources:
                requests:
                  storage: 10Gi

    # Custom rules from day 1 — convergent set across bjw-s + joryirving
    # homelab refs (OOM detection, ZFS pool state, Dockerhub rate limit).
    # Add more PrometheusRule CRs in-namespace later — the
    # ruleSelectorNilUsesHelmValues:false above picks them up cluster-wide.
    additionalPrometheusRulesMap:
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: >-
                    Container {{ $labels.container }} in pod
                    {{ $labels.namespace }}/{{ $labels.pod }} has been
                    OOMKilled {{ $value }} times in the last 10 minutes.
                expr: |-
                  (kube_pod_container_status_restarts_total
                    - kube_pod_container_status_restarts_total offset 10m >= 1)
                  and ignoring (reason)
                  min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: >-
                    ZFS pool {{$labels.zpool}} on {{$labels.instance}}
                    is in an unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: >-
                    {{ $value }} containers are pulling from Dockerhub —
                    rate limiting risk.
                expr: |-
                  count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: warning
