---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    # CRDs are decoupled into kube-prometheus-stack-crds Flux Kustomization.
    # Upgrades become a re-vendor + apply, not a chart-hook gamble.
    crds:
      enabled: false

    # Cleaner object names — drops the redundant "kube-prometheus-stack-"
    # prefix on generated resources.
    cleanPrometheusOperatorObjectNames: true

    # Grafana lives in its own HelmRelease (grafana-operator) so the
    # actual Grafana instance + datasources + auth are managed there.
    #
    # forceDeployDashboards + the operator block below makes the chart
    # render its 30+ bundled k8s dashboards (apiserver, kubelet, nodes,
    # k8s-resources-*, prometheus self, etc.) as ConfigMaps with the
    # `dashboards: grafana` label — the grafana-operator instance
    # selector then picks them up as GrafanaDashboard refs without any
    # per-dashboard wiring on our side.
    grafana:
      enabled: false
      forceDeployDashboards: true
      forceDeployDatasources: false
      defaultDashboardsEnabled: true
      sidecar:
        dashboards:
          # The chart's bundled dashboards target the prometheus
          # datasource by name "Prometheus" (capitalized); our
          # GrafanaDatasource CR creates one called "prometheus".
          # multicluster keeps the cluster label substitution sane
          # for single-cluster deployments.
          multicluster:
            global:
              enabled: false
      operator:
        dashboardsConfigMapRefEnabled: true
        matchLabels:
          dashboards: grafana
        folder: kubernetes
        resyncPeriod: 10m

    # node-exporter + kube-state-metrics use simpler names than the chart
    # default (which prefixes with the release name).
    prometheus-node-exporter:
      fullnameOverride: node-exporter
    kube-state-metrics:
      fullnameOverride: kube-state-metrics

    # Talos uses Cilium kube-proxy replacement — nothing to scrape on the
    # kube-proxy job.
    kubeProxy:
      enabled: false
    # On Talos, etcd runs co-located with the kube-apiserver pod on the
    # control plane; the chart's default etcd selector finds no pods.
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver

    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.ropxr.dev
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
      alertmanagerSpec:
        # References the AlertmanagerConfig CR shipped alongside this
        # HelmRelease (alertmanagerconfig.yaml). The CR carries the route
        # tree + ntfy webhook receiver.
        alertmanagerConfiguration:
          name: alertmanager
        externalUrl: https://alertmanager.ropxr.dev
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: zfs-nvmeof-1
              resources:
                requests:
                  storage: 1Gi
        # Internal Caddy CA for the ntfy webhook TLS is referenced
        # directly from the AlertmanagerConfig CR via the K8s-native
        # tlsConfig.ca.configMap field — the operator mounts the
        # ConfigMap into the Alertmanager pod itself. No manual
        # volumes/volumeMounts needed here.

    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.ropxr.dev
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
      prometheusSpec:
        externalUrl: https://prometheus.ropxr.dev
        # The four *SelectorNilUsesHelmValues:false flags make Prom pick up
        # ANY ServiceMonitor / PodMonitor / Probe / PrometheusRule /
        # ScrapeConfig in any namespace, without a label restriction. This
        # is the right default for a homelab where monitors will be added
        # ad-hoc next to the workloads they cover.
        # Tighten selection back to label-gated defaults (avoid scraping any
        # PodMonitor/ServiceMonitor/etc. cluster-wide by default).
        podMonitorSelectorNilUsesHelmValues: true
        probeSelectorNilUsesHelmValues: true
        ruleSelectorNilUsesHelmValues: true
        scrapeConfigSelectorNilUsesHelmValues: true
        serviceMonitorSelectorNilUsesHelmValues: true
        retention: 21d
        retentionSize: 40GB
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: zfs-nvmeof-1
              resources:
                requests:
                  storage: 40Gi

    # Custom rules from day 1 — convergent set across bjw-s + joryirving
    # homelab refs (OOM detection, ZFS pool state, Dockerhub rate limit).
    # Add more PrometheusRule CRs in-namespace later — the
    # ruleSelectorNilUsesHelmValues:false above picks them up cluster-wide.
    additionalPrometheusRulesMap:
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: >-
                    Container {{ $labels.container }} in pod
                    {{ $labels.namespace }}/{{ $labels.pod }} has been
                    OOMKilled {{ $value }} times in the last 10 minutes.
                expr: |-
                  (kube_pod_container_status_restarts_total
                    - kube_pod_container_status_restarts_total offset 10m >= 1)
                  and ignoring (reason)
                  min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: >-
                    ZFS pool {{$labels.zpool}} on {{$labels.instance}}
                    is in an unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: >-
                    {{ $value }} containers are pulling from Dockerhub —
                    rate limiting risk.
                expr: |-
                  count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: warning
