---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  path: ./kubernetes/apps/observability/kube-prometheus-stack/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  # Needs both the Prom-Operator CRDs (vendored) and the Grafana CRDs
  # (from grafana-operator) — the chart's forceDeployDashboards renders
  # GrafanaDashboard CRs alongside ServiceMonitor / PodMonitor / etc.
  dependsOn:
    - name: kube-prometheus-stack-crds
    - name: grafana-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
