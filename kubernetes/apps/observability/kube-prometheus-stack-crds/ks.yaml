---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-crds
spec:
  interval: 1h
  path: ./kubernetes/apps/observability/kube-prometheus-stack-crds/app
  prune: false  # CRDs hand-vendored — don't let Flux prune them mid-upgrade
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: true
