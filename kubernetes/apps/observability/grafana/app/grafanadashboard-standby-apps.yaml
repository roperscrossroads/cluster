---
# Standby apps: scale-to-zero web apps behind the KEDA HTTP add-on, plus
# KEDA core's health. State, wakes, minutes up, wait for a wake and failed
# wakes per app; traffic per route; ScaledObject errors and firing alerts.
#
# Generated by scripts/dashboards/standby-apps.py; edit that and rerun it
# (python3 scripts/dashboards/standby-apps.py) rather than hand-editing the
# JSON. Every query was checked against the live Prometheus.
#
# This file goes through Flux post-build substitution (the grafana
# Kustomization substitutes cluster-secrets), so the JSON must not contain a
# dollar followed by a brace: Grafana variables are written $route,
# $__range, never with braces.
#
# "In range" counts use (x - x offset $__range) or x instead of increase():
# a failure counter's series usually starts with the first failure, and
# increase() cannot see what a series held at its first sample.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: standby-apps
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: standby
  json: |
    {
      "uid": "standby-apps",
      "title": "Standby apps",
      "tags": [
        "keda",
        "standby"
      ],
      "editable": true,
      "schemaVersion": 39,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "panels": [
        {
          "type": "row",
          "title": "Standby apps (selected range)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "State now",
          "description": "Replicas of each Deployment scaled by the HTTP add-on (external-push ScaledObjects, found through KEDA operator metrics, which exist since 2026-11-24). 0 = standing by.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "max by (namespace, deployment) (kube_deployment_spec_replicas * on (namespace, deployment) group_left () label_replace(kube_horizontalpodautoscaler_info{horizontalpodautoscaler=~\"keda-hpa-.*\"}, \"deployment\", \"$1\", \"scaletargetref_name\", \"(.*)\") * on (namespace, deployment) group_left () label_replace(label_replace(max by (exported_namespace, scaledObject) (keda_scaler_active{scaler=\"externalPushScaler\"}) * 0 + 1, \"namespace\", \"$1\", \"exported_namespace\", \"(.*)\"), \"deployment\", \"$1\", \"scaledObject\", \"(.*)\"))",
              "legendFormat": "{{namespace}}/{{deployment}}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "noValue": "0",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "standby",
                      "color": "blue"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 1,
                    "to": 1000,
                    "result": {
                      "text": "up",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Wakes",
          "description": "Times replicas went from 0 to more than 0 (one wake, however many requests it held).",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum by (namespace, deployment) (count_over_time((max by (namespace, deployment) (kube_deployment_spec_replicas * on (namespace, deployment) group_left () label_replace(kube_horizontalpodautoscaler_info{horizontalpodautoscaler=~\"keda-hpa-.*\"}, \"deployment\", \"$1\", \"scaletargetref_name\", \"(.*)\") * on (namespace, deployment) group_left () label_replace(label_replace(max by (exported_namespace, scaledObject) (keda_scaler_active{scaler=\"externalPushScaler\"}) * 0 + 1, \"namespace\", \"$1\", \"exported_namespace\", \"(.*)\"), \"deployment\", \"$1\", \"scaledObject\", \"(.*)\")) > 0 and on (namespace, deployment) kube_deployment_spec_replicas offset 1m == 0)[$__range:1m]))",
              "legendFormat": "{{namespace}}/{{deployment}}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "noValue": "0",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Minutes up",
          "description": "Minutes with at least one replica: what standing by saves is the rest of the range.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 10,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum by (namespace, deployment) (count_over_time((max by (namespace, deployment) (kube_deployment_spec_replicas * on (namespace, deployment) group_left () label_replace(kube_horizontalpodautoscaler_info{horizontalpodautoscaler=~\"keda-hpa-.*\"}, \"deployment\", \"$1\", \"scaletargetref_name\", \"(.*)\") * on (namespace, deployment) group_left () label_replace(label_replace(max by (exported_namespace, scaledObject) (keda_scaler_active{scaler=\"externalPushScaler\"}) * 0 + 1, \"namespace\", \"$1\", \"exported_namespace\", \"(.*)\"), \"deployment\", \"$1\", \"scaledObject\", \"(.*)\")) > 0)[$__range:1m]))",
              "legendFormat": "{{namespace}}/{{deployment}}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "noValue": "0",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Avg wait for a wake",
          "description": "Mean time requests were held while their app started (successful cold starts).",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 14,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum by (route_name) ((clamp_min(interceptor_cold_start_duration_seconds_sum{outcome=\"ready\", route_name=~\"$route\"} - interceptor_cold_start_duration_seconds_sum{outcome=\"ready\", route_name=~\"$route\"} offset $__range, 0) or interceptor_cold_start_duration_seconds_sum{outcome=\"ready\", route_name=~\"$route\"})) / sum by (route_name) ((clamp_min(interceptor_cold_start_duration_seconds_count{outcome=\"ready\", route_name=~\"$route\"} - interceptor_cold_start_duration_seconds_count{outcome=\"ready\", route_name=~\"$route\"} offset $__range, 0) or interceptor_cold_start_duration_seconds_count{outcome=\"ready\", route_name=~\"$route\"}))",
              "legendFormat": "{{route_name}}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1,
              "noValue": "0",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Failed wakes",
          "description": "Requests that got 504 (app not ready within timeouts.readiness) or 503 (more waiting than maxPendingRequests). Alerts: KedaHttpWakeTimedOut, KedaHttpWakeRejected.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum by (route_name) ((clamp_min(interceptor_cold_start_duration_seconds_count{outcome=\"timeout\", route_name=~\"$route\"} - interceptor_cold_start_duration_seconds_count{outcome=\"timeout\", route_name=~\"$route\"} offset $__range, 0) or interceptor_cold_start_duration_seconds_count{outcome=\"timeout\", route_name=~\"$route\"}))",
              "legendFormat": "timeout {{route_name}}",
              "instant": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "B",
              "expr": "sum by (route_name) ((clamp_min(interceptor_cold_start_rejections_total{route_name=~\"$route\"} - interceptor_cold_start_rejections_total{route_name=~\"$route\"} offset $__range, 0) or interceptor_cold_start_rejections_total{route_name=~\"$route\"}))",
              "legendFormat": "rejected {{route_name}}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "noValue": "0",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Replicas",
          "description": "Each step up is a wake; each step down is the cooldown ending.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "max by (namespace, deployment) (kube_deployment_spec_replicas * on (namespace, deployment) group_left () label_replace(kube_horizontalpodautoscaler_info{horizontalpodautoscaler=~\"keda-hpa-.*\"}, \"deployment\", \"$1\", \"scaletargetref_name\", \"(.*)\") * on (namespace, deployment) group_left () label_replace(label_replace(max by (exported_namespace, scaledObject) (keda_scaler_active{scaler=\"externalPushScaler\"}) * 0 + 1, \"namespace\", \"$1\", \"exported_namespace\", \"(.*)\"), \"deployment\", \"$1\", \"scaledObject\", \"(.*)\"))",
              "legendFormat": "{{namespace}}/{{deployment}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false,
                "lineInterpolation": "stepAfter",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Requests through the interceptor",
          "description": "Per route and status code. Static routes (/healthz) are not counted.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum by (route_name, code) (rate(interceptor_request_count_total{route_name=~\"$route\"}[$__rate_interval]))",
              "legendFormat": "{{route_name}} {{code}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false,
                "lineInterpolation": "stepAfter",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Wait for a wake (per hour)",
          "description": "Cold-start wait over the trailing hour; empty when nothing woke.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le, route_name) (increase(interceptor_cold_start_duration_seconds_bucket{outcome=\"ready\", route_name=~\"$route\"}[1h]))) > 0",
              "legendFormat": "p50 {{route_name}}"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le, route_name) (increase(interceptor_cold_start_duration_seconds_bucket{outcome=\"ready\", route_name=~\"$route\"}[1h]))) > 0",
              "legendFormat": "p95 {{route_name}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "points",
                "lineWidth": 1,
                "fillOpacity": 80,
                "showPoints": "auto",
                "spanNulls": false,
                "lineInterpolation": "linear",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Request duration p95",
          "description": "Includes cold starts, so spikes line up with wakes.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, route_name) (rate(interceptor_request_duration_seconds_bucket{route_name=~\"$route\"}[$__rate_interval]))) > 0",
              "legendFormat": "{{route_name}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false,
                "lineInterpolation": "stepAfter",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "In flight",
          "description": "Concurrent requests per route (the scaling metric) and how many interceptors are serving.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum by (route_name) (interceptor_request_concurrency{route_name=~\"$route\"})",
              "legendFormat": "{{route_name}}"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "B",
              "expr": "sum(kube_deployment_status_replicas_ready{namespace=\"keda-system\", deployment=\"keda-add-ons-http-interceptor\"})",
              "legendFormat": "interceptor replicas"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false,
                "lineInterpolation": "stepAfter",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "KEDA core",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Firing alerts",
          "description": "KEDA and add-on alerts firing now.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 23
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "count by (alertname) (ALERTS{alertname=~\"Keda.*\", alertstate=\"firing\"})",
              "legendFormat": "{{alertname}}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "noValue": "0",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "ScaledObject errors",
          "description": "KEDA failing to evaluate a ScaledObject. Alert: KedaScaledObjectErrors (10 min).",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 6,
            "y": 23
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "sum by (exported_namespace, scaledObject) (increase(keda_scaled_object_errors_total[$__rate_interval]))",
              "legendFormat": "{{exported_namespace}}/{{scaledObject}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 80,
                "showPoints": "auto",
                "spanNulls": false,
                "lineInterpolation": "linear",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Scale loop latency",
          "description": "How late KEDA's polling loop runs per ScaledObject; growth means the operator is struggling.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 15,
            "y": 23
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "refId": "A",
              "expr": "max by (exported_namespace, resource) (keda_internal_scale_loop_latency_seconds)",
              "legendFormat": "{{exported_namespace}}/{{resource}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false,
                "lineInterpolation": "stepAfter",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        }
      ],
