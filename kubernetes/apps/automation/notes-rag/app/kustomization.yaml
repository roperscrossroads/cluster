---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: automation
resources:
  - ./pvc.yaml
  - ./rbac.yaml
  - ./default-sa-patch.yaml
  - ./secrets/registry-auth.sops.yaml
  - ./secrets/memtech-credentials.sops.yaml
  - ./secrets/openwebui-credentials.sops.yaml
  - ./secrets/forgejo-credentials.sops.yaml
  # SSH deploy key for the dagu-scheduler's git-sync sidecar to clone
  # `dev/dagu-dags` (source of truth for all DAG yamls). The HelmRelease
  # for dagu patches in the sidecar + mounts this secret.
  - ./secrets/dagu-dags-ssh.sops.yaml

# DAG yamls now live in `dev/dagu-dags` on internal Forgejo, synced into
# the dagu-scheduler pod by a git-sync sidecar (added via Flux
# postRenderer on the dagu HelmRelease). The chart's `extraEnv` sets
# DAGU_DAGS_DIR=/data/git/dagu-dags/current/dags so all four Dagu
# components (scheduler/ui/coordinator/worker) read from the synced tree.
configMapGenerator:
  # Internal Caddy CA — mounted into step pods so git/curl/httpx all
  # trust internal *.lab TLS. Stable name (no hash) since the cert is rare
  # to rotate and we don't want hash-driven step-pod redeploys.
  - name: internal-ca
    files:
      - ca.crt=internal-ca.crt
    options:
      disableNameSuffixHash: true
  # git credential helper — keeps the Forgejo PAT out of clone URLs,
  # env vars, and DAG yaml. Mounted into git_pull at /etc/git-helpers/.
  - name: notes-rag-git-helper
    files:
      - cred-helper.sh=git-cred-helper.sh
    options:
      disableNameSuffixHash: true
generatorOptions:
  disableNameSuffixHash: false
