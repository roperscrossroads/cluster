# Source: ~/agents/docs/superpowers/specs/2026-05-09-notes-rag-endpoint-design.md
# Driver code:  ~/agents/notes-rag-ingest/
#
# Schedule: every 15 min. Re-ingests ~/notes/local/infra/ into OpenWebUI KB
# infra-notes + memtech (tag corpus:notes-infra). Idempotent: each run
# always runs every step; an empty diff produces an empty manifest, and
# push steps with empty manifest are no-ops.
#
# Note on commands: dagu's k8s executor requires single-line string
# commands (multi-line literal/folded scalars are auto-detected as
# `script:` which the executor rejects; flow-form `[sh, -c, ...]` is
# rejected as multi-command). Inner shell is single-line, no inner
# double-quote escaping needed because we use single-quoted YAML.

name: notes-rag-ingest
description: Re-ingest ~/notes/local/infra into OpenWebUI KB + memtech every 15 min
type: graph
schedule: "*/15 * * * *"
max_active_runs: 1

kubernetes:
  namespace: automation
  service_account: notes-rag-runner
  image_pull_secrets:
    - registry-home-arpa-auth
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  pod_security_context:
    fs_group: 0
    seccomp_profile:
      type: RuntimeDefault

steps:
  - id: git_pull
    type: k8s
    with:
      image: alpine/git:2.49.1
      env:
        - name: GIT_SSL_CAINFO
          value: /etc/ssl/internal-ca/ca.crt
        # safe.directory bypass — step pods run as a different uid than
        # the previous owner of the cloned dir on the RWX PV, which trips
        # git's "dubious ownership" check by default.
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: safe.directory
        - name: GIT_CONFIG_VALUE_0
          value: /state/notes
      env_from:
        - secret_ref:
            name: forgejo-credentials
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
        - name: ca
          config_map:
            name: internal-ca
      volume_mounts:
        - name: state
          mount_path: /state
        - name: ca
          mount_path: /etc/ssl/internal-ca
          read_only: true
    # Credentials embedded in the cloned remote URL via FORGE_TOKEN env;
    # subsequent fetches reuse the URL stored in /state/notes/.git/config.
    # The token is on the cluster PV — fine, this is the same PV that
    # holds the cloned source content.
    command: 'sh -c "set -e; if [ ! -d /state/notes/.git ]; then git clone --depth=200 https://oauth2:$FORGE_TOKEN@forge.home.arpa/adam/notes.git /state/notes; fi; git -C /state/notes fetch origin master; git -C /state/notes reset --hard origin/master"'

  - id: compute_diff
    type: k8s
    depends:
      - git_pull
    with:
      image: alpine/git:2.49.1
      env:
        - name: GIT_SSL_CAINFO
          value: /etc/ssl/internal-ca/ca.crt
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: safe.directory
        - name: GIT_CONFIG_VALUE_0
          value: /state/notes
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
        - name: ca
          config_map:
            name: internal-ca
      volume_mounts:
        - name: state
          mount_path: /state
        - name: ca
          mount_path: /etc/ssl/internal-ca
          read_only: true
    # Empty-tree SHA 4b825dc6... is the well-known git empty tree;
    # diffing HEAD against it on first run yields a complete A-line list
    # in standard --name-status format, no busybox-specific find -printf.
    command: 'sh -c "set -e; HEAD_SHA=$(git -C /state/notes rev-parse --short HEAD); echo $HEAD_SHA > /state/head-sha.txt; if [ -s /state/last-indexed-commit ]; then LAST=$(cat /state/last-indexed-commit); git -C /state/notes diff --name-status ${LAST}..HEAD -- local/infra/ > /state/diff.txt; else git -C /state/notes diff --name-status 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD -- local/infra/ > /state/diff.txt; fi"'

  - id: chunk_files
    type: k8s
    depends:
      - compute_diff
    with:
      image: registry.home.arpa:8080/notes-rag-ingest:v0.1.0
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
      volume_mounts:
        - name: state
          mount_path: /state
    command: 'sh -c "SHA=$(cat /state/head-sha.txt); notes-rag-ingest chunk-from-diff --working-tree /state/notes --commit-sha $SHA --subtree local/infra/ < /state/diff.txt > /state/manifest.json"'

  - id: push_openwebui
    type: k8s
    depends:
      - chunk_files
    with:
      image: registry.home.arpa:8080/notes-rag-ingest:v0.1.0
      env:
        - name: SSL_CERT_FILE
          value: /etc/ssl/internal-ca/ca.crt
      env_from:
        - secret_ref:
            name: openwebui-credentials
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
        - name: ca
          config_map:
            name: internal-ca
      volume_mounts:
        - name: state
          mount_path: /state
        - name: ca
          mount_path: /etc/ssl/internal-ca
          read_only: true
    command: 'sh -c "notes-rag-ingest push-openwebui < /state/manifest.json"'

  - id: push_memtech
    type: k8s
    depends:
      - chunk_files
    with:
      image: registry.home.arpa:8080/notes-rag-ingest:v0.1.0
      env:
        - name: SSL_CERT_FILE
          value: /etc/ssl/internal-ca/ca.crt
      env_from:
        - secret_ref:
            name: memtech-credentials
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
        - name: ca
          config_map:
            name: internal-ca
      volume_mounts:
        - name: state
          mount_path: /state
        - name: ca
          mount_path: /etc/ssl/internal-ca
          read_only: true
    command: 'sh -c "notes-rag-ingest push-memtech < /state/manifest.json"'

  - id: write_state
    type: k8s
    depends:
      - push_openwebui
      - push_memtech
    with:
      image: alpine:3.20
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
      volume_mounts:
        - name: state
          mount_path: /state
    command: 'sh -c "cp /state/head-sha.txt /state/last-indexed-commit && rm -f /state/diff.txt /state/manifest.json /state/head-sha.txt"'

handler_on:
  failure:
    type: k8s
    with:
      image: curlimages/curl:8.10.1
    command: 'sh -c "curl -sS -X POST -H Title:notes-rag-ingest-failed -d failed https://ntfy.home.arpa/ops || true"'
