# Source: ~/agents/docs/superpowers/specs/2026-05-09-notes-rag-endpoint-design.md
# Driver code:  ~/agents/notes-rag-ingest/
#
# Schedule: every 15 min. Re-ingests ~/notes/local/infra/ into OpenWebUI KB
# infra-notes + memtech (tag corpus:notes-infra). Idempotent: each run
# always runs every step; an empty diff produces an empty manifest, and
# push steps with empty manifest are no-ops.
#
# Note on commands: dagu's k8s executor requires single-line string
# commands (multi-line literal/folded scalars are auto-detected as
# `script:` which the executor rejects; flow-form `[sh, -c, ...]` is
# rejected as multi-command). Inner shell is single-line, no inner
# double-quote escaping needed because we use single-quoted YAML.

name: notes-rag-ingest
description: Re-ingest ~/notes/local/infra into OpenWebUI KB + memtech every 15 min
type: graph
# Re-enabled 2026-05-11 after bge-m3 cutover + clean reindex baseline
# (2054 chunks in OpenWebUI, 2276 in memtech). last-indexed-commit is
# tracked so each tick is incremental. Known limitation: push step
# is not idempotent under partial-success — see
# ~/notes/local/infra/services/notes-rag.md "Known limitations".
schedule: "*/15 * * * *"
max_active_runs: 1

kubernetes:
  namespace: automation
  service_account: notes-rag-runner
  image_pull_secrets:
    - internal-registry-auth
  # Prevent k8s-level retries on a step Job. Dagu's workflow-level
  # error handling is what we want; a per-Job retry mid-push duplicates
  # uploads (each retry creates new files in OpenWebUI's global Files
  # store, since chunk content is unique-per-chunk by design).
  backoff_limit: 0
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # Per-step container security context — drops PodSecurity audit
  # warnings against the `restricted` profile in step pod logs.
  # The chunker, alpine/git, and curlimages/curl images all run
  # fine as a non-root uid; the PV is brought to fs_group ownership
  # automatically by k8s on volume mount.
  # The notes-rag-state PVC is NFS-backed (root_squash maps root → 65534
  # on the server). State files written by earlier root-runs already
  # belong to uid 65534 there, so we run step pods as that uid; trying
  # to chown across the NFS export fails with "Operation not permitted".
  security_context:
    run_as_non_root: true
    run_as_user: 65534
    run_as_group: 65534
    allow_privilege_escalation: false
    capabilities:
      drop: [ALL]
    seccomp_profile:
      type: RuntimeDefault
  pod_security_context:
    fs_group: 65534
    seccomp_profile:
      type: RuntimeDefault

steps:
  - id: git_pull
    type: k8s
    with:
      image: alpine/git:2.49.1
      env:
        - name: GIT_SSL_CAINFO
          value: /etc/ssl/internal-ca/ca.crt
        # safe.directory bypass — step pods run as a different uid than
        # the previous owner of the cloned dir on the RWX PV, which trips
        # git's "dubious ownership" check by default.
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: safe.directory
        - name: GIT_CONFIG_VALUE_0
          value: /state/notes
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
        - name: ca
          config_map:
            name: internal-ca
        - name: forgejo-secret
          secret:
            secret_name: forgejo-credentials
        - name: git-helper
          config_map:
            name: notes-rag-git-helper
      volume_mounts:
        - name: state
          mount_path: /state
        - name: ca
          mount_path: /etc/ssl/internal-ca
          read_only: true
        - name: forgejo-secret
          mount_path: /etc/secrets
          read_only: true
        - name: git-helper
          mount_path: /etc/git-helpers
          read_only: true
    # Credential helper reads the PAT from /etc/secrets/FORGE_TOKEN at
    # git-invocation time, so the token never lives in clone URLs,
    # env vars, or DAG yaml. The clone URL itself is read from
    # /etc/secrets/FORGE_URL so the internal hostname doesn't appear
    # in this manifest (which is in a public-mirrored repo). The
    # remote URL is reset on every run to scrub any token-embedded
    # URL left behind by earlier deployments.
    command: 'sh -c "set -e; URL=$(cat /etc/secrets/FORGE_URL); if [ ! -d /state/notes/.git ]; then git -c \"credential.helper=!sh /etc/git-helpers/cred-helper.sh\" clone --depth=200 $URL /state/notes; fi; git -C /state/notes remote set-url origin $URL; git -C /state/notes -c \"credential.helper=!sh /etc/git-helpers/cred-helper.sh\" fetch origin master; git -C /state/notes reset --hard origin/master"'

  - id: compute_diff
    type: k8s
    depends:
      - git_pull
    with:
      image: alpine/git:2.49.1
      env:
        - name: GIT_SSL_CAINFO
          value: /etc/ssl/internal-ca/ca.crt
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: safe.directory
        - name: GIT_CONFIG_VALUE_0
          value: /state/notes
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
        - name: ca
          config_map:
            name: internal-ca
      volume_mounts:
        - name: state
          mount_path: /state
        - name: ca
          mount_path: /etc/ssl/internal-ca
          read_only: true
    # Empty-tree SHA 4b825dc6... is the well-known git empty tree;
    # diffing HEAD against it on first run yields a complete A-line list
    # in standard --name-status format, no busybox-specific find -printf.
    command: 'sh -c "set -e; HEAD_SHA=$(git -C /state/notes rev-parse --short HEAD); echo $HEAD_SHA > /state/head-sha.txt; if [ -s /state/last-indexed-commit ]; then LAST=$(cat /state/last-indexed-commit); git -C /state/notes diff --name-status ${LAST}..HEAD -- local/infra/ > /state/diff.txt; else git -C /state/notes diff --name-status 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD -- local/infra/ > /state/diff.txt; fi"'

  - id: chunk_files
    type: k8s
    depends:
      - compute_diff
    with:
      image: ${REGISTRY_BASE}/notes-rag-ingest:v0.2.2
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
      volume_mounts:
        - name: state
          mount_path: /state
    command: 'sh -c "SHA=$(cat /state/head-sha.txt); notes-rag-ingest chunk-from-diff --working-tree /state/notes --commit-sha $SHA --subtree local/infra/ < /state/diff.txt > /state/manifest.json"'

  - id: push_openwebui
    type: k8s
    depends:
      - chunk_files
    with:
      image: ${REGISTRY_BASE}/notes-rag-ingest:v0.2.2
      env:
        - name: SSL_CERT_FILE
          value: /etc/ssl/internal-ca/ca.crt
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
        - name: ca
          config_map:
            name: internal-ca
        - name: openwebui-secret
          secret:
            secret_name: openwebui-credentials
      volume_mounts:
        - name: state
          mount_path: /state
        - name: ca
          mount_path: /etc/ssl/internal-ca
          read_only: true
        - name: openwebui-secret
          mount_path: /etc/secrets
          read_only: true
    command: 'sh -c "notes-rag-ingest push-openwebui < /state/manifest.json"'

  - id: push_memtech
    type: k8s
    depends:
      - chunk_files
    with:
      image: ${REGISTRY_BASE}/notes-rag-ingest:v0.2.2
      env:
        - name: SSL_CERT_FILE
          value: /etc/ssl/internal-ca/ca.crt
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
        - name: ca
          config_map:
            name: internal-ca
        - name: memtech-secret
          secret:
            secret_name: memtech-credentials
      volume_mounts:
        - name: state
          mount_path: /state
        - name: ca
          mount_path: /etc/ssl/internal-ca
          read_only: true
        - name: memtech-secret
          mount_path: /etc/secrets
          read_only: true
    command: 'sh -c "notes-rag-ingest push-memtech < /state/manifest.json"'

  - id: write_state
    type: k8s
    depends:
      - push_openwebui
      - push_memtech
    with:
      image: alpine:3.20
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
      volume_mounts:
        - name: state
          mount_path: /state
    command: 'sh -c "mv -f /state/head-sha.txt /state/last-indexed-commit && rm -f /state/diff.txt /state/manifest.json"'

handler_on:
  failure:
    type: k8s
    with:
      image: curlimages/curl:8.10.1
    command: 'sh -c "curl -sS -X POST -H Title:notes-rag-ingest-failed -d failed ${NTFY_URL} || true"'
