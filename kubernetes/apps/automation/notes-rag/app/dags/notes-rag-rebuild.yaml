# Manual-trigger full rebuild — no schedule.
# Use after the chunker changes shape, the tag scheme changes, or a
# destination gets out of sync.

name: notes-rag-rebuild
description: Manual-trigger full rebuild of the notes-rag corpus
type: graph
max_active_runs: 1

kubernetes:
  namespace: automation
  service_account: notes-rag-runner
  image_pull_secrets:
    - registry-home-arpa-auth
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  security_context:
    run_as_non_root: true
    run_as_user: 1000
    allow_privilege_escalation: false
    capabilities:
      drop: [ALL]
    seccomp_profile:
      type: RuntimeDefault
  pod_security_context:
    fs_group: 1000
    seccomp_profile:
      type: RuntimeDefault

steps:
  - id: wipe_memtech
    type: k8s
    with:
      image: curlimages/curl:8.10.1
      volumes:
        - name: memtech-secret
          secret:
            secret_name: memtech-credentials
      volume_mounts:
        - name: memtech-secret
          mount_path: /etc/secrets
          read_only: true
    command: |-
      sh -c "curl -ksS -X DELETE -H \"X-API-Key: $(cat /etc/secrets/MEMTECH_API_KEY)\" -H 'Content-Type: application/json' -d '[\"corpus:notes-infra\"]' \"$(cat /etc/secrets/MEMTECH_BASE_URL)/api/documents/remove-by-tags\""

  - id: wipe_openwebui
    type: k8s
    with:
      image: registry.home.arpa:8080/notes-rag-ingest:v0.2.0
      env:
        - name: SSL_CERT_FILE
          value: /etc/ssl/internal-ca/ca.crt
      volumes:
        - name: ca
          config_map:
            name: internal-ca
        - name: openwebui-secret
          secret:
            secret_name: openwebui-credentials
      volume_mounts:
        - name: ca
          mount_path: /etc/ssl/internal-ca
          read_only: true
        - name: openwebui-secret
          mount_path: /etc/secrets
          read_only: true
    command: wipe-openwebui-kb

  - id: clear_state
    type: k8s
    depends:
      - wipe_memtech
      - wipe_openwebui
    with:
      image: alpine:3.20
      volumes:
        - name: state
          persistent_volume_claim:
            claim_name: notes-rag-state
      volume_mounts:
        - name: state
          mount_path: /state
    command: 'sh -c "rm -f /state/last-indexed-commit"'

  - id: trigger_ingest
    depends:
      - clear_state
    # Native Dagu sub-DAG run.
    run: notes-rag-ingest
    params: ""
