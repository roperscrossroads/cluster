---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notes-rag
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/automation/notes-rag/app
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: automation
  wait: false
  dependsOn:
    - name: dagu
