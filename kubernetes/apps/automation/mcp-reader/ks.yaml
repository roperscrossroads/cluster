# Flux Kustomization wrapper for the read-only reader SA consumed by the
# external Kubernetes MCP server on the operator workstation. Mirrors
# nemo-monitor/ks.yaml. No metadata.namespace: the parent
# automation/kustomization.yaml sets `namespace: automation` at the kustomize
# top level. No dependsOn: this app is pure RBAC + a token Secret with no
# runtime dependency on other apps.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-reader
spec:
  interval: 1h
  path: ./kubernetes/apps/automation/mcp-reader/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: automation
  wait: false
