# Internal-only HTTPRoute. The verifier UI / API is reachable from inside
# the lab at https://claims.home.arpa but NOT from the public Cloudflare
# tunnel — same pattern as Dagu (envoy-internal Gateway, not envoy-public).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: notes-verifier
  namespace: automation
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - claims.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: notes-verifier
          port: 80
