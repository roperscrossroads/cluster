# notes-verifier RBAC — read-only across the cluster, write nothing.
#
# The verifier *must* never be granted update/patch/delete/create on any
# real resource. Anything beyond get/list/watch is a misconfiguration.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notes-verifier-runner
  namespace: automation
imagePullSecrets:
  - name: internal-registry-auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claims-reader
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - services
      - pods
      - pods/log
      - configmaps
      - persistentvolumeclaims
      - endpoints
      - events
      - nodes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - httproutes
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claims-reader
subjects:
  - kind: ServiceAccount
    name: notes-verifier-runner
    namespace: automation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claims-reader
