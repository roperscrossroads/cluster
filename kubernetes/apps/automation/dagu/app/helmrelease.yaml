---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dagu
spec:
  interval: 1h
  chart:
    spec:
      chart: dagu
      version: "1.0.10"
      sourceRef:
        kind: HelmRepository
        name: dagu
  # The chart exposes only `extraEnv` for customisation — no sidecar /
  # extraVolumes hook. Inject the git-sync sidecar via Flux postRenderer
  # (kustomize strategic-merge patch on the scheduler Deployment).
  #
  # The sidecar polls `dev/dagu-dags` every 10s and writes the working
  # tree to /data/git/dagu-dags/ on the shared dagu-data RWX PVC. The
  # symlink `current` points at the latest checked-out SHA. All four
  # Dagu components (scheduler/ui/coordinator/worker) mount the same
  # PVC, so they all read the same DAG tree via DAGU_DAGS_DIR below.
  #
  # SSH deploy key + known_hosts come from the `dagu-dags-ssh` Secret
  # (lives in ~/.../notes-rag/app/secrets/dagu-dags-ssh.sops.yaml).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: dagu-scheduler
            patch: |
              # initContainer: clone the repo once *before* the scheduler
              # starts. Without this, the scheduler's startup logic races
              # the sidecar and creates DAGU_DAGS_DIR as a real directory
              # (populated with chart example DAGs), which then blocks
              # git-sync from managing `current` as a symlink.
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: git-sync-init
                    image: registry.k8s.io/git-sync/git-sync:v4.7.1
                    imagePullPolicy: IfNotPresent
                    env:
                      - {name: GITSYNC_REPO, value: "ssh://forgejo@gitd.home.arpa/dev/dagu-dags.git"}
                      - {name: GITSYNC_REF, value: "main"}
                      - {name: GITSYNC_ROOT, value: "/data/git/dagu-dags"}
                      - {name: GITSYNC_LINK, value: "current"}
                      - {name: GITSYNC_ONE_TIME, value: "true"}
                      - {name: GITSYNC_SSH_KEY_FILE, value: "/etc/git-secret/ssh-key"}
                      - {name: GITSYNC_SSH_KNOWN_HOSTS_FILE, value: "/etc/git-secret/known_hosts"}
                      - {name: GITSYNC_VERBOSE, value: "2"}
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65534
                      runAsGroup: 65534
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: {drop: [ALL]}
                    resources:
                      requests: {cpu: "10m", memory: "32Mi"}
                      limits:   {memory: "128Mi"}
                    volumeMounts:
                      - {name: data, mountPath: /data}
                      - {name: git-sync-secret, mountPath: /etc/git-secret, readOnly: true}
                      - {name: git-sync-tmp, mountPath: /tmp}
              - op: add
                path: /spec/template/spec/containers/-
                value:
                  name: git-sync
                  image: registry.k8s.io/git-sync/git-sync:v4.7.1
                  imagePullPolicy: IfNotPresent
                  env:
                    - {name: GITSYNC_REPO, value: "ssh://forgejo@gitd.home.arpa/dev/dagu-dags.git"}
                    - {name: GITSYNC_REF, value: "main"}
                    - {name: GITSYNC_PERIOD, value: "10s"}
                    - {name: GITSYNC_ROOT, value: "/data/git/dagu-dags"}
                    - {name: GITSYNC_LINK, value: "current"}
                    - {name: GITSYNC_SSH_KEY_FILE, value: "/etc/git-secret/ssh-key"}
                    - {name: GITSYNC_SSH_KNOWN_HOSTS_FILE, value: "/etc/git-secret/known_hosts"}
                    - {name: GITSYNC_VERBOSE, value: "2"}
                  securityContext:
                    runAsNonRoot: true
                    # Match the chart's container UID (nobody=65534) so we
                    # can write into /data/git/dagu-dags on the shared
                    # PVC where /data/git already exists owned by nobody.
                    runAsUser: 65534
                    runAsGroup: 65534
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities: {drop: [ALL]}
                  resources:
                    requests: {cpu: "10m", memory: "32Mi"}
                    limits:   {memory: "128Mi"}
                  volumeMounts:
                    - {name: data, mountPath: /data}
                    - {name: git-sync-secret, mountPath: /etc/git-secret, readOnly: true}
                    # Writable /tmp for git's transient gitconfig + index
                    # while keeping the container root fs read-only.
                    - {name: git-sync-tmp, mountPath: /tmp}
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: git-sync-secret
                  secret:
                    secretName: dagu-dags-ssh
                    # 0444 (world-readable). Secret files are owned by
                    # root:root regardless of pod runAsUser; 0400 would
                    # mean git-sync (uid 65534) can't read them at all.
                    defaultMode: 0444
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: git-sync-tmp
                  emptyDir: {medium: Memory, sizeLimit: 64Mi}
              # Replace the chart's HTTP /health livenessProbe with an exec
              # probe that exercises the scheduler loop. The chart's probe
              # stays green during dagu's known silent-hang failure mode
              # (scheduler loop wedges; the HTTP server keeps responding),
              # so kubelet never restarts the pod.
              #
              # Signal: the `lastTick` field inside /data/scheduler/state.json,
              # NOT the file's mtime. The planner main loop is the only thing
              # that advances lastTick, but the file mtime is also bumped by
              # the zombie detector, retry scanner, and lock heartbeat — so
              # mtime can stay fresh while the planner is wedged (observed
              # 2026-05-14: hang at 09:11 after a git-sync symlink swap; mtime
              # stayed green for ~4h via background goroutines until manual
              # restart). Parsing lastTick keys the probe to the actual loop.
              #
              # Threshold: 600s stale fails the probe; with periodSeconds=60
              # and failureThreshold=3, kubelet restarts after ~3 consecutive
              # failures past the threshold = ~12 min total silence.
              # The HTTP /health readinessProbe (set by the chart) stays as-is.
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  exec:
                    command:
                      - sh
                      - -c
                      - "test $(($(date -u +%s) - $(date -d \"$(jq -r .lastTick /data/scheduler/state.json)\" +%s))) -lt 600"
                  initialDelaySeconds: 90
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 3
                  successThreshold: 1

          # ---------------------------------------------------------------
          # Pin Deployment selectors to stable identity labels.
          #
          # The chart renders `helm.sh/chart: dagu-<version>` *into*
          # spec.selector.matchLabels. A Deployment's selector is immutable
          # after creation — it's the identity key the ReplicaSet controller
          # uses to adopt pods — so every chart bump asked Helm to make an
          # illegal change and the upgrade failed with:
          #
          #   Deployment.apps "dagu-scheduler" is invalid: spec.selector:
          #     Invalid value: {... "helm.sh/chart":"dagu-1.0.10"}:
          #     field is immutable
          #
          # Observed 1.0.6 -> 1.0.10 (2026-07-23): Flux exhausted its 3
          # retries, rolled back to 1.0.6, and the stalled HelmRelease then
          # blocked the memory-loop and notes-rag Kustomizations via
          # dependsOn. Recreating the Deployments clears the current break;
          # this patch is what stops it recurring on 1.0.11.
          #
          # Restricting matchLabels to the stable identity labels makes the
          # selector version-independent, so future bumps produce no
          # selector diff at all. The pod template keeps the chart's full
          # label set — a selector need only be a *subset* of template
          # labels, and Helm's own guidance is that it be a stable one.
          #
          # `replace` rather than `remove` is deliberate: it stays valid if
          # upstream later drops helm.sh/chart from the selector itself,
          # whereas `remove` on a then-missing path would hard-error.
          #
          # dagu-worker-general is deliberately NOT patched — its selector
          # carries no version-derived label, so it is already stable. (Its
          # one-time break was a real rename, daguit.dev/worker-pool ->
          # dagu.sh/worker-pool, fixed by the same recreate.)
          - target:
              kind: Deployment
              name: dagu-scheduler
            patch: |
              - op: replace
                path: /spec/selector/matchLabels
                value:
                  app.kubernetes.io/name: dagu
                  app.kubernetes.io/instance: dagu
                  app.kubernetes.io/component: scheduler
          - target:
              kind: Deployment
              name: dagu-coordinator
            patch: |
              - op: replace
                path: /spec/selector/matchLabels
                value:
                  app.kubernetes.io/name: dagu
                  app.kubernetes.io/instance: dagu
                  app.kubernetes.io/component: coordinator
          - target:
              kind: Deployment
              name: dagu-ui
            patch: |
              - op: replace
                path: /spec/selector/matchLabels
                value:
                  app.kubernetes.io/name: dagu
                  app.kubernetes.io/instance: dagu
                  app.kubernetes.io/component: ui

          # ---------------------------------------------------------------
          # Non-root migration (bead agents-ailb). Root cause CONFIRMED
          # from live evidence 2026-07-24 — it is NOT the "entrypoint fails
          # with sudo: unknown user" theory the bead/runbook inferred.
          #
          # Chart 1.0.10 switches `command:` -> `args:`. `command` overrode
          # the image ENTRYPOINT (/entrypoint.sh); `args` does not, so the
          # entrypoint now runs. It SUCCEEDS but drops privileges to the
          # image's default PUID/PGID (1000/1000) via `sudo -u "#1000"`
          # (verified: `/entrypoint.sh id` -> uid=1000(dagu), exit 0). dagu
          # then runs as uid 1000, but DAGU_HOME=/data and the operational
          # dirs /data/{dag-runs,queue,proc} are mode 0750 owned by
          # 65534:65534 (who NFS root_squash maps writes to). uid 1000 can
          # neither traverse nor write them -> pods never go Ready -> Helm
          # times out at 5m -> rollback. 1.0.6 only worked because `command`
          # bypassed the entrypoint and it ran as root (squashed to 65534).
          #
          # Fix: restore the `command:` form (identical argv to 1.0.6, so
          # the entrypoint stays bypassed) AND pin the process to uid 65534
          # directly, matching the PVC's existing ownership. The container
          # is never root at any instant -> runAsNonRoot / PSA restricted.
          # 65534 (not the chart's fsGroup:1000) => zero data migration:
          # the PVC's ~29k objects are already 65534:65534. fsGroup is inert
          # here regardless (all democratic-csi drivers are fsGroupPolicy
          # ReadWriteOnceWithFSType; dagu-data is RWX), set only for intent.
          #
          # `args: []` is required: command + non-empty args would duplicate
          # the argv (command appends args). Container securityContext is
          # `add` (chart renders none); pod securityContext is `replace`
          # (chart renders {fsGroup: 1000}).
          - target: {kind: Deployment, name: dagu-coordinator}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/command
                value: [dagu, coordinator, --config, /etc/dagu/dagu.yaml]
              - op: replace
                path: /spec/template/spec/containers/0/args
                value: []
              - op: replace
                path: /spec/template/spec/securityContext
                value:
                  runAsNonRoot: true
                  runAsUser: 65534
                  runAsGroup: 65534
                  fsGroup: 65534
                  seccompProfile: {type: RuntimeDefault}
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
          - target: {kind: Deployment, name: dagu-scheduler}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/command
                value: [dagu, scheduler, --config, /etc/dagu/dagu.yaml]
              - op: replace
                path: /spec/template/spec/containers/0/args
                value: []
              - op: replace
                path: /spec/template/spec/securityContext
                value:
                  runAsNonRoot: true
                  runAsUser: 65534
                  runAsGroup: 65534
                  fsGroup: 65534
                  seccompProfile: {type: RuntimeDefault}
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
          - target: {kind: Deployment, name: dagu-ui}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/command
                value: [dagu, server, --config, /etc/dagu/dagu.yaml]
              - op: replace
                path: /spec/template/spec/containers/0/args
                value: []
              - op: replace
                path: /spec/template/spec/securityContext
                value:
                  runAsNonRoot: true
                  runAsUser: 65534
                  runAsGroup: 65534
                  fsGroup: 65534
                  seccompProfile: {type: RuntimeDefault}
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
          # Worker: same non-root treatment, PLUS restore the shared PVC.
          # Chart 1.0.10 flips the worker's `data` volume from the dagu-data
          # PVC to an emptyDir (upstream assumes stateless workers). Ours
          # must see the git-synced DAGs at /data/git/dagu-dags/current/dags
          # and share run state on the RWX PVC, so override it back.
          # volumes[0] is `data`, volumes[1] is `config` (verified in the
          # offline render). Note argv gains --worker.coordinators in 1.0.10.
          - target: {kind: Deployment, name: dagu-worker-general}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/command
                value: [dagu, worker, --config, /etc/dagu/dagu.yaml, --worker.coordinators, "dagu-coordinator.automation.svc.cluster.local:50055", --worker.labels, "environment=home,pool=general"]
              - op: replace
                path: /spec/template/spec/containers/0/args
                value: []
              - op: replace
                path: /spec/template/spec/securityContext
                value:
                  runAsNonRoot: true
                  runAsUser: 65534
                  runAsGroup: 65534
                  fsGroup: 65534
                  seccompProfile: {type: RuntimeDefault}
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
              - op: remove
                path: /spec/template/spec/volumes/0/emptyDir
              - op: add
                path: /spec/template/spec/volumes/0/persistentVolumeClaim
                value: {claimName: dagu-data}
  values:
    image:
      repository: ghcr.io/dagucloud/dagu
      tag: "2.6.10"
      pullPolicy: IfNotPresent

    # Built-in JWT auth + RBAC + first-user signup.
    # OIDC/SSO requires a paid self-host license — Authelia
    # forward-auth via Caddy on auth-manage handles SSO instead.
    auth:
      mode: builtin
      builtin:
        token:
          # Empty -> chart auto-generates secret at {data_dir}/auth/token_secret
          secret: ""
          ttl: "24h"

    # REQUIRED: ReadWriteMany for shared state across scheduler/coordinator/ui/workers
    persistence:
      enabled: true
      accessMode: ReadWriteMany
      size: 20Gi
      storageClass: zfs-nfs-1

    # Enable Steward (built-in AI assistant). The model entries themselves
    # are configured at /agent-settings in the UI (one JSON per model under
    # /data/agent/models/ on the RWX PVC). The vars below seed the values
    # that go in the form: Base URL, API Key (the dagu-steward LiteLLM
    # vkey), and a default model alias to start with. The same vars are
    # available to `dagu agent` invocations from inside any pod.
    #
    # chart's extraEnv goes through `toYaml` into the container env block,
    # so secretKeyRef is supported directly here — no postRenderer needed.
    extraEnv:
      - name: DAGU_AGENT_ENABLED
        value: "true"
      - name: DAGU_TZ
        value: "America/New_York"
      # Point all four Dagu components (scheduler/ui/coordinator/worker)
      # at the git-sync output path. The sidecar (see postRenderers
      # above) clones dev/dagu-dags into /data/git/dagu-dags/ and
      # maintains the `current` symlink pointing at the latest SHA.
      - name: DAGU_DAGS_DIR
        value: "/data/git/dagu-dags/current/dags"
      # Pin the run/queue/proc dirs so the `dagu` CLI (invoked via kubectl exec)
      # resolves the SAME paths as the daemon. Without these the CLI defaults to
      # /data/data/* and writes a divergent tree the UI never reads — the source
      # of stale "running" runs that survived restarts (see beads agents-j9d).
      - name: DAGU_DAG_RUNS_DIR
        value: "/data/dag-runs"
      - name: DAGU_QUEUE_DIR
        value: "/data/queue"
      - name: DAGU_PROC_DIR
        value: "/data/proc"
      # LiteLLM connection details for the Steward agent / `dagu agent`.
      # The agent UI stores its own copy of these inside model JSON files
      # once configured at /agent-settings — these env vars exist so you
      # can `kubectl exec ... env` to find the values when filling the
      # form, and so `dagu agent` invocations have them available.
      - name: LITELLM_BASE_URL
        valueFrom:
          secretKeyRef:
            name: litellm-dagu-steward-key
            key: endpoint
      - name: LITELLM_DAGU_STEWARD_API_KEY
        valueFrom:
          secretKeyRef:
            name: litellm-dagu-steward-key
            key: api-key
      - name: LITELLM_DAGU_STEWARD_DEFAULT_MODEL
        valueFrom:
          secretKeyRef:
            name: litellm-dagu-steward-key
            key: model

    # Single instance of the control-plane components. Workers scale separately.
    scheduler:
      replicas: 1
    coordinator:
      replicas: 1
      healthPort: 8091
      # Coordinator is latency-sensitive: it heartbeats workers over gRPC and
      # holds distributed-run leases. The chart-default 200m CPU limit caused
      # CFS throttling on ~55% of scheduling periods, which made it miss
      # heartbeats -> leases expired -> healthy runs marked stale/FAILED ->
      # OPERATION_RETRY churn (and one liveness-probe restart). The worker pool
      # had 500m headroom while this CPU-bound component had none. Give it room;
      # memory stays bounded.
      resources:
        requests:
          cpu: "200m"
          memory: "256Mi"
        limits:
          cpu: "1000m"
          memory: "512Mi"
    ui:
      replicas: 1
      service:
        port: 8080

    # One general worker pool to start. Add a 'harness' pool later for the
    # CLI coding-agent steps (claude/codex/etc.) — those need their binaries
    # baked into a custom image or installed via initContainer.
    worker:
      healthPort: 8092
    workerPools:
      general:
        replicas: 2
        labels:
          environment: home
          pool: general
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
