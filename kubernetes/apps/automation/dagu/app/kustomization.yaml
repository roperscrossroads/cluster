---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  # SSH deploy key for the git-sync sidecar that pulls dev/dagu-dags
  # into the scheduler pod (mounted at /etc/git-secret/ via the inline
  # kustomize patch in helmrelease.yaml's postRenderers). Lives with
  # dagu (not notes-rag) so the secret is in place before the chart
  # rolls — notes-rag's kustomization depends on dagu being ready.
  - ./secrets/dagu-dags-ssh.sops.yaml
  # LiteLLM virtual key for Steward (built-in UI agent) and the
  # `dagu agent` CLI. Allowlist on the LiteLLM side is local-first
  # (qwen3-coder-30b + granite-4-h-tiny + other local groups) with
  # anthropic-haiku as a cheap-fast fallback. Sourced from the
  # dagu-steward vkey in ~/infra-new/secrets/litellm-virtual-keys.sops.yaml.
  - ./secrets/litellm-dagu-steward-key.sops.yaml
