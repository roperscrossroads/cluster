---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: autoloop
spec:
  interval: 1h
  path: ./kubernetes/apps/automation/autoloop/app
  dependsOn:
    - name: dagu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: automation
  wait: false
