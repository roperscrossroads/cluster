---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Offline Flux render check (successor to flux-local). Two jobs on every PR that
# touches kubernetes/**:
#   - test: reconcile + render all Kustomizations/HelmReleases, fail on any error
#   - diff: render PR vs. base and post the rendered manifest delta as a comment,
#           so a reviewer sees exactly what a chart/image bump actually changes
#           in-cluster (RBAC rules, env, images) before merging.
name: "Flate"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed-files.outputs.changed_files != '[]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          # Also run when this workflow changes, so edits to the check are
          # exercised by their own PR.
          patterns: |-
            kubernetes/**
            .github/workflows/flate.yaml
            .github/scripts/flate-stand-in-secrets.sh

  test:
    name: Flate - Test
    needs: filter
    if: ${{ needs.filter.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0
        with:
          # The action defaults base to the default branch and exports it as
          # FLATE_BASE. The checkout here has no main ref, and --base is
          # mutually exclusive with --path-orig, so an empty base keeps test
          # on the full tree and lets diff use the explicit --path-orig.
          base: ""

      - name: Run Flate Test
        # --api-versions: charts that gate on .Capabilities.APIVersions (the
        # OpenShell preflight requires the Agent Sandbox API) see what the
        # live cluster serves; an offline render has no API server to ask.
        # --supply: stand-in cluster-secrets so ${VAR} substitutions are not
        # empty (CI cannot decrypt the real one); see the script.
        run: |
          .github/scripts/flate-stand-in-secrets.sh ./kubernetes/apps > "${RUNNER_TEMP}/stand-in-secrets.yaml"
          flate test all --path ./kubernetes/flux/cluster \
            --api-versions agents.x-k8s.io/v1beta1 \
            --supply "${RUNNER_TEMP}/stand-in-secrets.yaml"

  diff:
    name: Flate - Diff
    needs: filter
    if: ${{ needs.filter.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.repository.default_branch }}"
          persist-credentials: false
          path: default

      - name: Install Flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0
        with:
          # The action defaults base to the default branch and exports it as
          # FLATE_BASE. The checkout here has no main ref, and --base is
          # mutually exclusive with --path-orig, so an empty base keeps test
          # on the full tree and lets diff use the explicit --path-orig.
          base: ""

      - name: Run Flate Diff
        id: diff
        run: |
          # --path-orig puts flate in changed-only mode: it reconciles just the
          # subtree the PR touches, so the diff stays scoped and small.
          # --supply: stand-in cluster-secrets, as in the test job.
          ./pull/.github/scripts/flate-stand-in-secrets.sh ./pull/kubernetes/apps > "${RUNNER_TEMP}/stand-in-secrets.yaml"
          flate diff all \
            --path ./pull/kubernetes/flux/cluster \
            --path-orig ./default/kubernetes/flux/cluster \
            --api-versions agents.x-k8s.io/v1beta1 \
            --supply "${RUNNER_TEMP}/stand-in-secrets.yaml" \
            -o github > diff.patch
          # Comments and outputs are size-limited, so keep the first 60 KB.
          # A byte cut usually lands mid-line; without a final newline the
          # closing DIFF_EOF ends up on that line, GitHub can't find the
          # delimiter, and the step fails ("Matching delimiter not found").
          # sed '$a\' adds the newline only when it's missing; the note says
          # where the rest is.
          size=$(wc -c < diff.patch)
          head -c 60000 diff.patch | sed '$a\' > diff.short
          if [ "$size" -gt 60000 ]; then
            echo "... diff truncated: first 60000 of $size bytes shown; the full diff is in this job's log." >> diff.short
            cat diff.patch
          fi
          {
            echo 'diff<<DIFF_EOF'
            cat diff.short
            echo DIFF_EOF
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Flate Diff"
            echo '```diff'
            cat diff.short
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        with:
          message-id: "${{ github.event.pull_request.number }}/flate-diff"
          message-failure: Flate diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  success:
    name: Flate - Success
    needs: ["test", "diff"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
