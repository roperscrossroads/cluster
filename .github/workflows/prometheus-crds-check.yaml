---
# Backstop for the prometheus-operator CRD / kube-prometheus-stack chart pairing
# (see scripts/check-prometheus-crds.py and the .pre-commit-config.yaml hook):
# fails if the chart tag was bumped without re-vendoring the CRDs in
# kube-prometheus-stack-crds/app/crds/. Pure filesystem derivation, github-hosted.
name: "Prometheus CRDs Check"

on:
  pull_request:
    branches: ["main"]
    paths:
      - "kubernetes/apps/observability/kube-prometheus-stack/app/ocirepository.yaml"
      - "kubernetes/apps/observability/kube-prometheus-stack-crds/app/crds/**"
      - "scripts/check-prometheus-crds.py"
  push:
    branches: ["main"]
    paths:
      - "kubernetes/apps/observability/kube-prometheus-stack/app/ocirepository.yaml"
      - "kubernetes/apps/observability/kube-prometheus-stack-crds/app/crds/**"
      - "scripts/check-prometheus-crds.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: prometheus crds in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CRDs match kube-prometheus-stack tag
        run: python3 scripts/check-prometheus-crds.py
