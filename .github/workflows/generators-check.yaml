---
# Backstop for the commit-time tier-1 generators (see .pre-commit-config.yaml):
# fails if a generated artifact is stale, i.e. someone changed kubernetes/apps/
# without re-running the generator (or skipped the pre-commit hook). Pure
# filesystem derivation, github-hosted.
name: "Generators Check"

on:
  pull_request:
    branches: ["main"]
    paths:
      - "kubernetes/apps/**/ks.yaml"
      - "scripts/generate-apps-tree.py"
      - "CLAUDE.md"
  push:
    branches: ["main"]
    paths:
      - "kubernetes/apps/**/ks.yaml"
      - "scripts/generate-apps-tree.py"
      - "CLAUDE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: apps-tree current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: apps-tree is regenerated
        run: python3 scripts/generate-apps-tree.py --check
