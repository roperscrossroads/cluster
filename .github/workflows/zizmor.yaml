---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Static analysis of the GitHub Actions workflows themselves (zizmor). Catches
# credential persistence (persist-credentials), excessive GITHUB_TOKEN scope,
# template injection, unpinned actions, etc. — "shellcheck for CI". Gates on
# medium+ findings; advisory 'info' findings surface as annotations but don't
# block. Especially relevant here because some workflows run on self-hosted
# ARC runners inside the cluster.
name: "Zizmor"

on:
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/**"]
  push:
    branches: ["main"]
    paths: [".github/workflows/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          version: 1.32.0
          min-severity: medium
          # Fail the check on findings via inline annotations rather than
          # uploading SARIF (keeps this off the GitHub Advanced Security path).
          advanced-security: false
          annotations: true
