---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Static analysis of the GitHub Actions workflows themselves (zizmor). Catches
# credential persistence (persist-credentials), excessive GITHUB_TOKEN scope,
# template injection, unpinned actions, etc. — "shellcheck for CI". Gates on
# medium+ findings; advisory 'info' findings surface as annotations but don't
# block. Especially relevant here because some workflows run on self-hosted
# ARC runners inside the cluster.
name: "Zizmor"

on:
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/**"]
  push:
    branches: ["main"]
    paths: [".github/workflows/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: .github/workflows
          # No `version:`. The action pins zizmor itself: each action release
          # carries a hash-locked requirements file per zizmor version, and
          # the default (`latest`) is the newest one that release knows. So
          # the action's commit SHA above fixes the exact zizmor build too,
          # and Renovate has one thing to bump. Pinning zizmor separately let
          # the two drift: Renovate bumped zizmor to 1.33.1 before the action
          # knew that version, and every run failed with "Unknown version".
          min-severity: medium
          # Fail the check on findings via inline annotations rather than
          # uploading SARIF (keeps this off the GitHub Advanced Security path).
          advanced-security: false
          annotations: true
