---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Static analysis of the GitHub Actions workflows themselves (zizmor). Catches
# credential persistence (persist-credentials), excessive GITHUB_TOKEN scope,
# template injection, unpinned actions, etc. — "shellcheck for CI". Gates on
# medium+ findings; advisory 'info' findings surface as annotations but don't
# block. Especially relevant here because some workflows run on self-hosted
# ARC runners inside the cluster.
name: "Zizmor"

on:
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/**"]
  push:
    branches: ["main"]
    paths: [".github/workflows/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          inputs: .github/workflows
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          version: 1.26.1
          min-severity: medium
          # Fail the check on findings via inline annotations rather than
          # uploading SARIF (keeps this off the GitHub Advanced Security path).
          advanced-security: false
          annotations: true
