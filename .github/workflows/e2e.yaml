---
name: "e2e"

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - kubernetes/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-invalid:
    if: ${{ github.repository == 'onedr0p/cluster-template' }}
    name: reject-invalid (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - overlapping-cidrs
          - duplicate-gateway-addrs
          - duplicate-node-names
          - reserved-node-name
          - bad-mac-address
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          cache: false

      - name: Assert schema rejects ${{ matrix.fixture }}.toml
        run: |
          fixture=./.github/tests/invalid/${{ matrix.fixture }}.toml
          schema=./template/resources/config.schema.cue
          if cue export "$fixture" "$schema" --out yaml >/dev/null 2>&1; then
            echo "::error::schema accepted invalid fixture ${{ matrix.fixture }} (expected rejection)"
            exit 1
          fi
          echo "schema correctly rejected ${{ matrix.fixture }}"
          # Also surface the actual error message in the log for debuggability.
          cue export "$fixture" "$schema" --out yaml || true

  validate-valid:
    if: ${{ github.repository == 'onedr0p/cluster-template' }}
    name: accept-valid (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - public
          - private
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          cache: false

      - name: Run init recipe
        run: just init

      - name: Prepare files
        run: |
          cp ./.github/tests/valid/${{ matrix.fixture }}.toml cluster.toml
          echo '{"AccountTag":"fake","TunnelSecret":"fake","TunnelID":"fake"}' > cloudflare-tunnel.json
          touch kubeconfig

      - name: Run configure recipe
        run: just configure

      - name: Render talos configs
        run: just talos render

      - name: Install flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: ""

      - name: Run flate test
        run: flate test all --path ./kubernetes/flux/cluster

      - name: Dry run bootstrap talos recipe
        run: just --dry-run bootstrap talos

      - name: Dry run bootstrap apps recipe
        run: just --dry-run bootstrap apps

      - name: Run reset recipe
        run: yes | just template reset

      - name: Run tidy recipe
        run: yes | just template tidy
