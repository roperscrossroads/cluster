machine:
  kubelet:
    extraConfig:
      serializeImagePulls: false
    # local-path-provisioner hostPaths must resolve on the host, not inside
    # the kubelet container, or a kubelet restart/upgrade orphans the data.
    # Pairs with nodePathMap in storage-system/local-path-provisioner.
    extraMounts:
      - destination: /var/local-path-provisioner
        type: bind
        source: /var/local-path-provisioner
        options: [bind, rshared, rw]
    nodeIP:
      validSubnets:
        - 172.16.21.0/24
