# Local resolver first so Talos can pull from registry.home.arpa and so any
# host-level home.arpa name resolution works during `talosctl image pull`.
# Falls back to public for everything else.
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 172.16.20.40
  - address: 1.1.1.1
  - address: 1.0.0.1
searchDomains:
  disableDefault: true
