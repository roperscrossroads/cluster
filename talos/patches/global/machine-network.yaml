machine:
  network:
    disableSearchDomain: true
    nameservers:
      # Local resolver first so Talos can pull from registry.home.arpa
      # and so any host-level home.arpa name resolution works during
      # `talosctl image pull`. Falls back to public for everything else.
      - 172.16.20.40
      - 1.1.1.1
      - 1.0.0.1
