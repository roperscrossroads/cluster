[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true } # required:template
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
JUST_UNSTABLE = "1"

[tools]
"python" = "3.15.2" # required:template (downgraded from 3.14.4 — mise's 3.14 tarball is freethreaded with no lib/)
"uv" = "0.13.7" # required:template
"pipx" = "1.18.16" # required:template
"pipx:makejinja" = "2.9.2" # required:template
"github:postfinance/topf" = "v0.6.2"
"aqua:casey/just" = "1.59.0"
"aqua:charmbracelet/gum" = "2.0.2"
"aqua:chmln/sd" = "1.1.0" # required:template
"aqua:cilium/cilium-cli" = "0.20.2"
"aqua:cli/cli" = "2.103.3"
"aqua:cloudflare/cloudflared" = "2026.10.7"
"ubi:cue-lang/cue" = "0.17.1" # required:template (switched aqua: → ubi: because cue releases ship no checksums.txt that aqua requires)
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.10.0"
"aqua:getsops/sops" = "3.13.3"
"aqua:helm/helm" = "4.3.1"
"aqua:helmfile/helmfile" = "1.8.3"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.2"
"aqua:mikefarah/yq" = "4.54.3"
"aqua:siderolabs/talos" = "1.14.6"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"pipx:pre-commit" = "4.7.0"
