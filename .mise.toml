[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true } # required:template
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
JUST_UNSTABLE = "1"

[tools]
"python" = "3.13.7" # required:template (downgraded from 3.14.4 — mise's 3.14 tarball is freethreaded with no lib/)
"uv" = "0.11.29" # required:template
"pipx" = "1.11.1" # required:template
"pipx:makejinja" = "2.8.2" # required:template
"aqua:budimanjojo/talhelper" = "3.1.16"
"aqua:casey/just" = "1.50.0"
"aqua:charmbracelet/gum" = "0.17.0"
"aqua:chmln/sd" = "1.1.0" # required:template
"aqua:cilium/cilium-cli" = "0.19.6"
"aqua:cli/cli" = "2.92.0"
"aqua:cloudflare/cloudflared" = "2026.3.0"
"ubi:cue-lang/cue" = "0.16.1" # required:template (switched aqua: → ubi: because cue releases ship no checksums.txt that aqua requires)
"aqua:FiloSottile/age" = "1.3.1"
"aqua:fluxcd/flux2" = "2.8.6"
"aqua:getsops/sops" = "3.12.2"
"aqua:helm/helm" = "4.1.4"
"aqua:helmfile/helmfile" = "1.5.0"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
"aqua:kubernetes/kubernetes/kubectl" = "1.36.2"
"aqua:mikefarah/yq" = "4.53.3"
"aqua:siderolabs/talos" = "1.13.6"
"aqua:yannh/kubeconform" = "0.7.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"pipx:pre-commit" = "4.0.1"
