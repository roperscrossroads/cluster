---
# Defense-in-depth for plaintext-secret leaks: gitleaks runs on commit AND push.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # On pre-commit, gitleaks scans staged content. On pre-push, the same
        # hook runs again against the full diff being pushed — catches anything
        # that landed via `git add -f` or `--no-verify`.
        stages: [pre-commit, pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: end-of-file-fixer
        exclude: '(^|/)(_out/|\.private/)'
      - id: trailing-whitespace
        exclude: '(^|/)(_out/|\.private/)'
      - id: check-yaml
        # --unsafe disables strict tag-specific construction so we don't trip
        # on chart-vendored CRDs whose schemas include enum members like `- =`
        # and `- "!="` (label-selector operators) — PyYAML's strict loader
        # otherwise rejects them with "could not determine a constructor for
        # the tag 'tag:yaml.org,2002:value'". Safe because the staged content
        # is k8s manifests we trust + gitleaks runs ahead of this hook.
        args: [--allow-multiple-documents, --unsafe]
        # Skip SOPS-encrypted YAML (gitleaks already handles it; the binary
        # ENC[...] payloads can confuse the YAML parser on some inputs).
        exclude: '(^|/)(.*\.sops\.ya?ml|talos/clusterconfig/.*\.yaml)$'

  # Tier-1 generators: derive facts from the filesystem at commit time so docs
  # can't drift. The hook regenerates and re-stages; CI re-runs with --check.
  - repo: local
    hooks:
      - id: apps-tree
        name: regenerate AGENTS.md apps-tree from kubernetes/apps/
        entry: python3 scripts/generate-apps-tree.py
        language: system
        pass_filenames: false
        files: '^(kubernetes/apps/.*/ks\.yaml|scripts/generate-apps-tree\.py|AGENTS\.md)$'
      # Not a generator (re-vendoring needs `helm pull`): a pure check that the
      # decoupled CloudNativePG CRDs weren't left behind by an operator chart
      # bump. CI re-runs the same script (.github/workflows/cnpg-crds-check.yaml).
      - id: cnpg-crds
        name: cnpg CRDs track the operator chart tag
        entry: python3 scripts/check-cnpg-crds.py
        language: system
        pass_filenames: false
        files: '^(kubernetes/apps/cnpg-system/operator/app/ocirepository\.yaml|kubernetes/apps/cnpg-system/operator-crds/app/crds\.yaml|scripts/check-cnpg-crds\.py)$'
